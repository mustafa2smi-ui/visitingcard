    // ================================================================
    // LANGUAGE SWITCHING
    // ================================================================
    function switchLanguage(lang) {
      currentLanguage = lang;
      
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      renderContent(lang, currentTab);
      
      document.querySelectorAll('.legal-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tab === currentTab);
      });
    }

    // ================================================================
    // TAB NAVIGATION
    // ================================================================
    function setupTabs() {
      const tabs = document.querySelectorAll('.legal-tab');
      
      tabs.forEach(tab => {
        tab.addEventListener('click', function(e) {
          e.preventDefault();
          const tabId = this.dataset.tab;
          currentTab = tabId;
          
          tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tabId));
          
          history.pushState(null, '', '#' + tabId);
          
          renderContent(currentLanguage, tabId);
        });
      });
    }

    // ================================================================
    // INITIALIZATION
    // ================================================================
    document.addEventListener('DOMContentLoaded', function() {
      const savedLang = localStorage.getItem('adeendesk_legal_lang') || 'en';
      
      const hash = window.location.hash.replace('#', '');
      const initialTab = (hash && document.querySelector(`[data-tab="${hash}"]`)) ? hash : 'about';
      
      currentLanguage = savedLang;
      currentTab = initialTab;
      
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === savedLang);
      });
      
      document.querySelectorAll('.legal-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.tab === initialTab);
      });
      
      renderContent(savedLang, initialTab);
      
      setupTabs();
      
      window.addEventListener('hashchange', function() {
        const newHash = window.location.hash.replace('#', '');
        if (newHash && document.querySelector(`[data-tab="${newHash}"]`)) {
          currentTab = newHash;
          document.querySelectorAll('.legal-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.tab === newHash);
          });
          renderContent(currentLanguage, newHash);
        }
      });
    });

    document.addEventListener('DOMContentLoaded', function() {
      const langButtons = document.querySelectorAll('.lang-btn');
      langButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          localStorage.setItem('adeendesk_legal_lang', this.dataset.lang);
        });
      });
    });
  </script>
