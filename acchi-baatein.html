<body>

  <header class="header-bar">
    <a href="index.html" class="back-btn">⬅️ Dashboard</a>
    <h1 style="font-size:0.95rem; font-weight:800; margin:0;">Acchi Baatein Collection</h1>
  </header>

  <main id="quotesList"></main>

  <script>
    // Live date helper for share/copy texts
    function getLiveDatesForSharing() {
      const d = new Date();
      const engMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const engDateStr = `${d.getDate()} ${engMonths[d.getMonth()]} ${d.getFullYear()}`;

      const hijriMonths = [
        "Muharram", "Safar", "RabiulAwwal", "RabiulAkhir",
        "JamadilAwwal", "JamadilAkhir", "Rajab", "Shaban",
        "Ramadan", "Shawwal", "Zulqadah", "Zulhijjah"
      ];

      let hijriDateStr = "";
      try {
        const parts = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {
          day: 'numeric',
          month: 'numeric'
        }).formatToParts(d);

        let day = parts.find(p => p.type === 'day')?.value || d.getDate();
        let monthIndex = parseInt(parts.find(p => p.type === 'month')?.value || "1", 10) - 1;
        let monthName = hijriMonths[monthIndex] || "Islamic Month";
        hijriDateStr = `${day} ${monthName}`;
      } catch (e) {
        hijriDateStr = "Islamic Date";
      }

      return { engDateStr, hijriDateStr };
    }

    // acchi-baatein.html ke script section ko isse update karein:
const list = document.getElementById('quotesList');
if (typeof acchiBaatDatabase !== 'undefined' && Array.isArray(acchiBaatDatabase)) {
  acchiBaatDatabase.forEach((item, index) => {
    const art = document.createElement('article');
    art.className = 'quote-card';
    art.style.position = 'relative'; // Corner badge ke liye

    const lines = item.quoteLines.map(l => `<div class="quote-line">⚄→ ${l}</div>`).join('');
    
    // Disabled/Muted Corner Date: agar item.updatedAt ho to wo, warna default
    const updateDateText = item.updatedAt || "Archived";

    art.innerHTML = `
      <!-- 📌 Disabled Style Last Update Date in Corner -->
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #e2e8f0; padding-bottom:4px; margin-bottom:8px;">
        <span style="font-size:0.63rem; color:#94a3b8; font-weight:600; opacity:0.8; letter-spacing:0.2px;">
          🕒 Updated: ${updateDateText}
        </span>
        <span style="font-size:0.65rem; background:#f1f5f9; color:#64748b; font-weight:700; padding:1px 6px; border-radius:4px;">
          #${index + 1}
        </span>
      </div>

      <div class="quote-meta">🌺💦 ꧁﷽꧂ 💦🌺</div>
      <div style="text-align:center; font-weight:800; color:#047857; margin:4px 0 6px;">🌺💧 Sweet Word 💧🌺</div>
      
      ${lines}
      
      <div class="quote-dua">${item.closingDua || ''}</div>
      
      <div class="btn-row">
        <button class="action-btn btn-copy" onclick="copyQuote(${index})">📋 Copy WhatsApp</button>
        <button class="action-btn btn-share" onclick="shareQuote(${index})">📤 Share</button>
      </div>
    `;
    list.appendChild(art);
  });
}

    function copyQuote(index) {
      const item = acchiBaatDatabase[index];
      if (!item) return;

      const { engDateStr, hijriDateStr } = getLiveDatesForSharing();
      const siteUrl = window.location.origin + '/';

      const txt = `*🌺💦💠 ꧁﷽꧂ 💠💦🌺*\n\n*🌙 ${hijriDateStr} 🌙*\n*☀ ${engDateStr} ☀*\n*🌺💧💧 SωєєT ωσR∂ 💧💧🌺*\n\n${item.quoteLines.map(l => `*⚄→ ${l}*`).join('\n')}\n\n_${item.closingDua || ''}_\n🌺💦💠💦💠🌹💦💠💦💠🌺\n\nDaily Islamic Dashboard:\n${siteUrl}`;

      navigator.clipboard.writeText(txt).then(() => alert("WhatsApp format copy ho gaya!"));
    }

    function shareQuote(index) {
      const item = acchiBaatDatabase[index];
      if (!item) return;

      const { engDateStr, hijriDateStr } = getLiveDatesForSharing();
      const siteUrl = window.location.origin + '/';

      const txt = `*🌺💦💠 ꧁﷽꧂ 💠💦🌺*\n\n*🌙 ${hijriDateStr} 🌙*\n*☀ ${engDateStr} ☀*\n\n${item.quoteLines.map(l => `*⚄→ ${l}*`).join('\n')}\n\n_${item.closingDua || ''}_\n\n${siteUrl}`;

      if (navigator.share) {
        navigator.share({ title: "Aaj Ki Acchi Baat", text: txt, url: siteUrl }).catch(() => {});
      } else {
        copyQuote(index);
      }
    }
  </script>
