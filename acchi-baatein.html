<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aaj Ki Acchi Baat | Islamic Quotes & Sweet Words</title>
  <meta name="description" content="Rozana ki deeni wa roohani acchi baatein, aqwal-e-zareen aur WhatsApp messages direct copy-paste format me.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yourdomain.com/acchi-baatein.html">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="islamic-content-data.js"></script>
  <style>
    body { background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 14px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .back-btn { background: #0f172a; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; }
    .quote-card { background: #ffffff; border: 1.5px dashed #10b981; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .quote-meta { text-align: center; font-size: 0.74rem; font-weight: 700; color: #047857; margin-bottom: 4px; }
    .quote-line { font-size: 0.78rem; font-weight: 600; color: #1e293b; margin: 5px 0; line-height: 1.5; }
    .quote-dua { font-size: 0.72rem; color: #64748b; font-style: italic; margin-top: 8px; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .action-btn { flex: 1; padding: 7px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer; border: none; }
    .btn-copy { background: #10b981; color: #fff; }
    .btn-share { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  </style>
</head>
<body>

  <header class="header-bar">
    <a href="index.html" class="back-btn">⬅️ Dashboard</a>
    <h1 style="font-size:0.95rem; font-weight:800; margin:0;">Aaj Ki Acchi Baat Archive</h1>
  </header>

  <main id="quotesList"></main>

  <script>
    const list = document.getElementById('quotesList');
    if (typeof acchiBaatDatabase !== 'undefined') {
      acchiBaatDatabase.forEach(item => {
        const art = document.createElement('article');
        art.className = 'quote-card';
        const lines = item.quoteLines.map(l => `<div class="quote-line">⚄→ ${l}</div>`).join('');
        art.innerHTML = `
          <div class="quote-meta">🌺💦 ꧁﷽꧂ 💦🌺</div>
          <div class="quote-meta">🌙 ${item.hijriDate} | ☀ ${item.date}</div>
          <div style="text-align:center; font-weight:800; color:#047857; margin:6px 0;">🌺💧 Sweet Word 💧🌺</div>
          ${lines}
          <div class="quote-dua">${item.closingDua}</div>
          <div class="btn-row">
            <button class="action-btn btn-copy" onclick="copyQuote('${escape(JSON.stringify(item))}')">📋 Copy WhatsApp</button>
            <button class="action-btn btn-share" onclick="shareQuote('${escape(JSON.stringify(item))}')">📤 Share</button>
          </div>
        `;
        list.appendChild(art);
      });
    }

    function copyQuote(raw) {
      const item = JSON.parse(unescape(raw));
      const txt = `*🌺💦💠 ꧁﷽꧂ 💠💦🌺*\n\n*🌙 ${item.hijriDate} 🌙*\n*☀ ${item.date} ☀*\n*🌺💧💧 SωєєT ωσR∂ 💧💧🌺*\n\n${item.quoteLines.map(l => `*⚄→ ${l}*`).join('\n')}\n\n_${item.closingDua}_\n🌺💦💠💦💠🌹💦💠💦💠🌺\n\nDaily Dashboard:\n${window.location.href}`;
      navigator.clipboard.writeText(txt).then(() => alert("WhatsApp format copy ho gaya!"));
    }

    function shareQuote(raw) {
      const item = JSON.parse(unescape(raw));
      const txt = `*🌺💦💠 ꧁﷽꧂ 💠💦🌺*\n\n*🌙 ${item.hijriDate} 🌙*\n*☀ ${item.date} ☀*\n\n${item.quoteLines.map(l => `*⚄→ ${l}*`).join('\n')}\n\n${window.location.href}`;
      if (navigator.share) navigator.share({ title: "Aaj Ki Acchi Baat", text: txt, url: window.location.href });
      else copyQuote(raw);
    }
  </script>
</body>
</html>
