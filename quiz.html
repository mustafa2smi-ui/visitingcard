<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deeni Quiz & Islamic Knowledge | Sawal-Jawab & Missing Words</title>
  <meta name="description" content="Rozana Deeni Quiz, Missing Word Hadees Sharif aur Islami maloomat ka aasan aur stress-free platform bina kisi time limit ke.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yourdomain.com/quiz.html">

  <!-- JSON-LD Schema for Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Quiz",
    "name": "Daily Islamic Knowledge & Missing Words Quiz",
    "description": "Educational Islamic quiz questions and Hadith missing words with authentic references.",
    "inLanguage": ["ur-Latn", "en", "hi"]
  }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="quiz-data.js"></script>
  <style>
    :root {
      --primary: #064e3b;
      --gold: #b45309;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
    }

    body {
      background: var(--bg);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 14px;
      color: #0f172a;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .back-btn {
      background: #0f172a;
      color: #fff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.74rem;
      font-weight: 700;
    }

    /* Scoreboard Card */
    .score-card {
      background: linear-gradient(135deg, #064e3b, #047857);
      color: #ffffff;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      box-shadow: 0 4px 12px rgba(6, 78, 59, 0.15);
    }
    .score-num {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fef08a;
    }

    /* Question Container */
    .quiz-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .badge-tag {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      background: #ecfdf5;
      color: #047857;
    }
    .question-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
      margin: 12px 0 16px 0;
      line-height: 1.5;
    }

    /* Options Stack */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-btn {
      width: 100%;
      text-align: left;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      box-sizing: border-box;
      font-family: inherit;
    }
    .opt-btn:active { transform: scale(0.99); }
    
    .opt-btn.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
    }
    .opt-btn.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
    }

    /* Hawala / Wazahat Box */
    .explanation-box {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      border-radius: 6px;
      font-size: 0.76rem;
      color: #78350f;
      line-height: 1.5;
    }

    /* Bottom Action Bar */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }
    .btn-next {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }
    .btn-reset {
      background: none;
      border: none;
      color: #64748b;
      font-size: 0.7rem;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <a href="index.html" class="back-btn">⬅️ Dashboard</a>
    <h1 style="font-size:0.95rem; font-weight:800; margin:0; color:var(--primary);">Deeni Quiz & Ilmi Maloomat</h1>
  </header>

  <!-- Score & Progress Banner -->
  <div class="score-card">
    <div>
      <span style="font-size:0.7rem; opacity:0.85;">Total Earned Ilmi Points:</span>
      <div class="score-num" id="totalScore">0 pts</div>
    </div>
    <div style="text-align:right;">
      <span style="font-size:0.7rem; opacity:0.85;">Progress:</span>
      <div style="font-size:0.85rem; font-weight:700;" id="progressText">1 / --</div>
    </div>
  </div>

  <!-- Quiz Card Area -->
  <main class="quiz-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="badge-tag" id="qTypeBadge">Missing Word</span>
      <span style="font-size:0.68rem; color:#64748b; font-weight:700;">Zero Stress • No Timer ⏱️</span>
    </div>

    <h2 class="question-title" id="qTitle">Sawal load ho raha hai...</h2>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="explanation-box" id="explanationBox"></div>

    <div class="action-bar">
      <button class="btn-reset" onclick="resetUserScore()">Score Zero Karein 🔄</button>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">Agla Sawal ➔</button>
    </div>
  </main>

  <script>
    let currentIndex = 0;
    let answered = false;
    let score = parseInt(localStorage.getItem('islamic_quiz_points') || '0', 10);

    function initQuizPage() {
      document.getElementById('totalScore').innerText = `${score} pts`;

      if (typeof islamicQuizDatabase === 'undefined' || !Array.isArray(islamicQuizDatabase) || islamicQuizDatabase.length === 0) {
        document.getElementById('qTitle').innerText = "Abhi koi sawal mojood nahi hai.";
        return;
      }

      loadQuestion(currentIndex);
    }

    function loadQuestion(idx) {
      answered = false;
      const item = islamicQuizDatabase[idx];
      if (!item) return;

      document.getElementById('progressText').innerText = `${idx + 1} / ${islamicQuizDatabase.length}`;
      document.getElementById('qTypeBadge').innerText = item.type || "Deeni Sawal";
      document.getElementById('qTitle').innerText = item.question;

      const exp = document.getElementById('explanationBox');
      exp.style.display = 'none';
      exp.innerHTML = '';

      const nextBtn = document.getElementById('btnNext');
      nextBtn.style.display = 'none';

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      const letters = ['A', 'B', 'C', 'D'];

      item.options.forEach((opt, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span><strong>${letters[optIdx]})</strong>  ${opt}</span><span class="indicator"></span>`;
        btn.onclick = () => selectOption(optIdx, btn);
        container.appendChild(btn);
      });
    }

    function selectOption(chosenIndex, clickedBtn) {
      if (answered) return;
      answered = true;

      const item = islamicQuizDatabase[currentIndex];
      const allBtns = document.querySelectorAll('.opt-btn');

      if (chosenIndex === item.correctIndex) {
        clickedBtn.classList.add('correct');
        clickedBtn.querySelector('.indicator').innerText = "✅ Sahi";
        score += 10;
        localStorage.setItem('islamic_quiz_points', score);
        document.getElementById('totalScore').innerText = `${score} pts`;
      } else {
        clickedBtn.classList.add('wrong');
        clickedBtn.querySelector('.indicator').innerText = "❌ Galat";
        
        // Sahi jawab ko green highlight karna
        const correctBtn = allBtns[item.correctIndex];
        if (correctBtn) {
          correctBtn.classList.add('correct');
          correctBtn.querySelector('.indicator').innerText = "✅ Sahi Jawab";
        }
      }

      // Wazahat / Hawala dikhana
      const exp = document.getElementById('explanationBox');
      exp.innerHTML = `📖 <strong>Hawala / Wazahat:</strong> ${item.explanation}`;
      exp.style.display = 'block';

      // Agla button show karna
      const nextBtn = document.getElementById('btnNext');
      if (currentIndex < islamicQuizDatabase.length - 1) {
        nextBtn.innerText = "Agla Sawal ➔";
      } else {
        nextBtn.innerText = "Wapas Shuru Se Khele'n 🔄";
      }
      nextBtn.style.display = 'block';
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= islamicQuizDatabase.length) {
        currentIndex = 0;
      }
      loadQuestion(currentIndex);
    }

    function resetUserScore() {
      if (confirm("Kya aap apna score zero karna chahte hain?")) {
        score = 0;
        localStorage.setItem('islamic_quiz_points', '0');
        document.getElementById('totalScore').innerText = "0 pts";
      }
    }

    window.addEventListener('DOMContentLoaded', initQuizPage);
  </script>
</body>
</html>
