<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Lecture - Share Market Course</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #10b981;
      --bg-white: #f8fafc;
      --card-white: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* 3) White Background View */
    body { background-color: var(--bg-white); color: var(--text-dark); line-height: 1.4; }

    .player-header {
      padding: 0.7rem 1.2rem; background: #ffffff;
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
    }
    .back-btn { color: #0284c7; text-decoration: none; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    .main-layout {
      max-width: 1200px; margin: 1rem auto 2rem;
      padding: 0 1rem; display: grid; grid-template-columns: 2.2fr 1fr; gap: 1.2rem;
    }
    @media (max-width: 850px) { .main-layout { grid-template-columns: 1fr; } }

    /* Video Player Card */
    .player-card {
      background: var(--card-white); border-radius: 8px; padding: 0.9rem;
      border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .video-viewport {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      background: #000; border-radius: 6px; overflow: hidden;
    }
    .video-viewport iframe { width: 100%; height: 100%; border: none; }

    /* Anti-Redirect Shields */
    .yt-shield-top { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 10; background: transparent; }
    .yt-shield-logo { position: absolute; bottom: 0; right: 0; width: 80px; height: 45px; z-index: 10; background: transparent; }

    .video-meta { margin-top: 0.8rem; }
    .video-meta h2 { font-size: 1.2rem; color: #0f172a; }

    /* 3) White & Clean Playlist List View */
    .playlist-card {
      background: var(--card-white); border-radius: 8px; border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-height: 82vh; display: flex; flex-direction: column;
    }
    .playlist-head {
      padding: 0.8rem 1rem; border-bottom: 1px solid var(--border-color);
      font-size: 0.92rem; font-weight: 700; color: #1e293b; display: flex; justify-content: space-between;
    }
    
    .lesson-list { list-style: none; overflow-y: auto; padding: 0.5rem; }

    .lesson-item {
      padding: 0.65rem 0.8rem; border-radius: 6px; margin-bottom: 0.4rem;
      background: #f1f5f9; cursor: pointer; display: flex; align-items: center;
      gap: 10px; border: 1px solid transparent; transition: all 0.2s;
    }
    .lesson-item:hover { background: #e2e8f0; }
    .lesson-item.active {
      border-color: var(--primary);
      background: #ecfdf5;
      color: #065f46;
      font-weight: 700;
    }

    .badge-free {
      background: #10b981; color: #fff; font-size: 0.65rem;
      padding: 2px 5px; border-radius: 3px; font-weight: 700;
    }
  </style>
</head>
<body>

  <header class="player-header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Course Dashboard</a>
    <span style="font-size:0.8rem; color:var(--text-muted);" id="userActiveEmail">Member</span>
  </header>

  <div class="main-layout">
    <div class="player-card">
      <div class="video-viewport">
        <div class="yt-shield-top"></div>
        <div class="yt-shield-logo"></div>
        <iframe id="videoPlayerFrame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      </div>

      <div class="video-meta">
        <h2 id="currentLessonTitle">Loading...</h2>
      </div>
    </div>

    <!-- White List View -->
    <div class="playlist-card">
      <div class="playlist-head">
        <span>Course Index</span>
        <span style="color:var(--primary); font-size:0.8rem;" id="totalCounter">Topics</span>
      </div>
      <ul id="lessonList" class="lesson-list"></ul>
    </div>
  </div>

  <script src="course.js"></script>
</body>
</html>
