<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Player - Share Market Course</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #10b981;
      --bg-dark: #090d16;
      --card-bg: #151f30;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); }

    .player-header {
      padding: 0.8rem 1.5rem;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
    }

    .back-btn {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .main-layout {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: 2.2fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    /* Video Frame Section */
    .player-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1rem;
      border: 1px solid #1f2937;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin: 0 auto;
      transition: all 0.3s ease;
    }

    /* Ratio Modes: Long (16:9) vs Short (9:16) */
    .video-viewport.mode-long {
      aspect-ratio: 16 / 9;
    }

    .video-viewport.mode-short {
      aspect-ratio: 9 / 16;
      max-width: 340px;
    }

    .video-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-meta {
      margin-top: 1rem;
    }

    .video-meta h2 {
      font-size: 1.3rem;
      margin-bottom: 0.4rem;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid #334155;
    }

    /* Toggle Switches */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }

    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151; transition: .3s; border-radius: 22px;
    }
    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Right/Bottom Playlist Section */
    .playlist-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
    }

    .playlist-head {
      padding: 1rem;
      border-bottom: 1px solid #1f2937;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .lesson-list {
      list-style: none;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .lesson-item {
      padding: 0.8rem;
      border-radius: 6px;
      margin-bottom: 0.4rem;
      background: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
      transition: background 0.2s;
    }

    .lesson-item:hover {
      background: #1e293b;
    }

    .lesson-item.active {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.1);
    }

    .lesson-item .badge-type {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #334155;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header class="player-header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    <span style="font-size: 0.85rem; color: var(--text-muted);" id="userActiveEmail">User Session</span>
  </header>

  <div class="main-layout">
    <!-- Video Player -->
    <div class="player-card">
      <div id="videoViewport" class="video-viewport mode-long">
        <iframe id="videoPlayerFrame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
      </div>

      <div class="video-meta">
        <span id="currentLessonCat" class="badge-type">Category</span>
        <h2 id="currentLessonTitle">Loading lesson...</h2>
      </div>

      <div class="controls-bar">
        <!-- Frame ratio switch button -->
        <button id="ratioToggleBtn" style="background:#1f2937; color:#fff; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:0.8rem;">
          <i class="fa-solid fa-expand"></i> Switch Format (Long/Short)
        </button>

        <!-- Auto Play Toggle -->
        <div class="toggle-wrap">
          <span>Auto Next</span>
          <label class="toggle-switch">
            <input type="checkbox" id="autoPlayToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- Playlist / List View -->
    <div class="playlist-card">
      <div class="playlist-head">
        <span>Course Index</span>
        <span style="color:var(--primary); font-size:0.8rem;" id="totalCounter">0 Topics</span>
      </div>
      <ul id="lessonList" class="lesson-list">
        <!-- Injected dynamically -->
      </ul>
    </div>
  </div>

  <script src="course.js"></script>
</body>
</html>
