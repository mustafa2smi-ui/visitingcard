<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Lecture - Share Market Course</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #10b981;
      --bg-white: #f8fafc;
      --card-white: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { background-color: var(--bg-white); color: var(--text-dark); line-height: 1.4; }

    .player-header {
      padding: 0.7rem 1.2rem; background: #ffffff;
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color);
    }
    .back-btn { color: #0284c7; text-decoration: none; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    /* 4) Breadcrumbs Navigation */
    .breadcrumbs {
      max-width: 1200px; margin: 0.7rem auto 0; padding: 0 1rem;
      font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px;
    }
    .breadcrumbs a { color: #0284c7; text-decoration: none; }
    .breadcrumbs span.current { color: #0f172a; font-weight: 600; }

    .main-layout {
      max-width: 1200px; margin: 0.6rem auto 2rem;
      padding: 0 1rem; display: grid; grid-template-columns: 2.2fr 1fr; gap: 1.2rem;
    }
    @media (max-width: 850px) { .main-layout { grid-template-columns: 1fr; } }

    /* Video Player Card */
    .player-card {
      background: var(--card-white); border-radius: 8px; padding: 0.9rem;
      border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .video-viewport {
      position: relative; width: 100%; aspect-ratio: 16 / 9;
      background: #000; border-radius: 6px; overflow: hidden;
    }
    .video-viewport iframe { width: 100%; height: 100%; border: none; }

    .yt-shield-top { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 10; background: transparent; }
    .yt-shield-logo { position: absolute; bottom: 0; right: 0; width: 80px; height: 45px; z-index: 10; background: transparent; }

    .video-meta { margin-top: 0.8rem; }
    .video-meta h2 { font-size: 1.15rem; color: #0f172a; }

    /* White & Clean Playlist View */
    .playlist-card {
      background: var(--card-white); border-radius: 8px; border: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-height: 82vh; display: flex; flex-direction: column;
    }
    .playlist-head {
      padding: 0.8rem 1rem; border-bottom: 1px solid var(--border-color);
      font-size: 0.92rem; font-weight: 700; color: #1e293b; display: flex; justify-content: space-between;
    }
    
    .lesson-list { list-style: none; overflow-y: auto; padding: 0.5rem; }

    .parent-group { margin-bottom: 0.5rem; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
    .parent-header {
      padding: 0.65rem 0.8rem; background: #f8fafc; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; font-weight: 700;
    }
    .parent-header:hover { background: #f1f5f9; }
    .parent-header.active { background: #ecfdf5; color: #065f46; border-left: 3px solid var(--primary); }

    .sub-list { list-style: none; background: #fff; border-top: 1px solid var(--border-color); }
    .sub-item {
      padding: 0.5rem 0.8rem 0.5rem 1.8rem; font-size: 0.78rem; color: #475569;
      cursor: pointer; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f1f5f9;
    }
    .sub-item:last-child { border-bottom: none; }
    .sub-item:hover { background: #f8fafc; color: #0284c7; }
    .sub-item.active { background: #eff6ff; color: #0284c7; font-weight: 700; }

    .badge-free {
      background: #10b981; color: #fff; font-size: 0.62rem;
      padding: 1px 5px; border-radius: 3px; font-weight: 700;
    }
  </style>
</head>
<body>

  <header class="player-header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Course Dashboard</a>
    <span style="font-size:0.8rem; color:var(--text-muted);" id="userActiveEmail">Member</span>
  </header>

  <!-- 4) Breadcrumbs Bar -->
  <nav class="breadcrumbs" aria-label="Breadcrumb">
    <a href="index.html">Home</a>
    <i class="fa-solid fa-angle-right" style="font-size:0.65rem;"></i>
    <span id="breadCat">Category</span>
    <i class="fa-solid fa-angle-right" style="font-size:0.65rem;"></i>
    <span class="current" id="breadTitle">Lesson</span>
  </nav>

  <div class="main-layout">
    <div class="player-card">
      <div class="video-viewport">
        <div class="yt-shield-top"></div>
        <div class="yt-shield-logo"></div>
        <iframe id="videoPlayerFrame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
     <!-- Video Viewport ke andar Iframe ke theek baad -->
<div id="playerLockOverlay" style="display:none; position:absolute; inset:0; background:rgba(11, 17, 32, 0.92); z-index:20; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:1.5rem;">
  <div style="width:55px; height:55px; background:rgba(245, 158, 11, 0.15); border:1px solid #f59e0b; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:1rem;">
    <i class="fa-solid fa-lock" style="font-size:1.6rem; color:#fbbf24;"></i>
  </div>
  <h3 style="font-size:1.15rem; color:#fff; margin-bottom:0.4rem;">Ye Chapter Locked Hai</h3>
  <p style="font-size:0.85rem; color:#94a3b8; max-width:320px; margin-bottom:1.2rem; line-height:1.4;">
    Subscription plan buy karke saare course unlock karein aur full roadmap access karein.
  </p>
  <a href="index.html#authBox" style="background:#10b981; color:#0b1120; text-decoration:none; padding:0.6rem 1.4rem; border-radius:6px; font-weight:700; font-size:0.85rem; box-shadow:0 4px 15px rgba(16,185,129,0.3);">
    <i class="fa-solid fa-key"></i> Unlock All Courses
  </a>
</div>

      </div>

      <div class="video-meta">
        <h2 id="currentLessonTitle">Loading...</h2>
      </div>
    </div>

    <!-- White Theme Playlist with Subcategories -->
    <div class="playlist-card">
      <div class="playlist-head">
        <span>Course Index</span>
        <span style="color:var(--primary); font-size:0.8rem;" id="totalCounter">Topics</span>
      </div>
      <ul id="lessonList" class="lesson-list"></ul>
    </div>
  </div>

  <script src="course.js"></script>
</body>
</html>
