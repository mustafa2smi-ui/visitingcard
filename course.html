<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watch Lecture - Saralsharemarket</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #10b981;
      --bg-white: #f8fafc;
      --card-white: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-white);
      color: var(--text-dark);
      line-height: 1.4;
      display: flex;
      flex-direction: column;
      height: 100vh; /* Fixed app height */
      overflow: hidden; /* Main window scroll block */
    }

    /* Fixed Compact Header */
    .player-header {
      padding: 0.55rem 1rem;
      background: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      z-index: 60;
    }
    .back-btn { color: #0284c7; text-decoration: none; font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }

    /* Main Container (Mobile-first app layout) */
    .main-app-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    @media (min-width: 850px) {
      .main-app-container {
        flex-direction: row;
        gap: 1.2rem;
        padding: 1rem;
      }
    }

    /* 1) STICKY TOP VIDEO AREA */
    .sticky-video-section {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #000;
      width: 100%;
      flex-shrink: 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    @media (min-width: 850px) {
      .sticky-video-section {
        position: static;
        flex: 2.2;
        background: transparent;
        box-shadow: none;
      }
    }

    /* Viewport & Shield Layers */
    .video-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      margin: 0 auto;
      max-height: 45vh; /* Mobile par screen cover na kare */
    }

    @media (min-width: 850px) {
      .video-viewport {
        border-radius: 8px;
        max-height: none;
      }
    }

    .video-viewport iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Anti-Redirect Shields: Top title & Logo click block */
    .yt-shield-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      z-index: 15;
      background: transparent;
    }
    .yt-shield-logo {
      position: absolute;
      bottom: 0; right: 0;
      width: 75px; height: 42px;
      z-index: 15;
      background: transparent;
    }

    /* Custom Web Fullscreen (Blocks YouTube app redirect in full view) */
    .video-viewport.is-custom-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      max-height: none !important;
      aspect-ratio: auto !important;
      z-index: 99999 !important;
      border-radius: 0 !important;
    }

    .fs-toggle-btn {
      position: absolute;
      bottom: 8px;
      left: 10px;
      z-index: 25;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    /* Video Meta Info */
    .video-info-bar {
      background: #fff;
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid var(--border-color);
    }
    .video-info-bar h2 {
      font-size: 0.95rem;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .credit-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    /* 2) INDEPENDENT SCROLLABLE PLAYLIST */
    .scrollable-content-section {
      flex: 1;
      overflow-y: auto; /* Sirf playlist scroll hogi */
      -webkit-overflow-scrolling: touch;
      padding: 0.6rem;
      background: var(--bg-white);
    }

    @media (min-width: 850px) {
      .scrollable-content-section {
        flex: 1;
        background: #fff;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 0.8rem;
        height: calc(100vh - 80px);
      }
    }

    .playlist-head {
      font-size: 0.85rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }

    .lesson-list { list-style: none; padding-bottom: 3rem; }
    
    .parent-group {
      margin-bottom: 0.45rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
    }
    .parent-header {
      padding: 0.6rem 0.75rem;
      background: #f8fafc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .parent-header.active {
      background: #ecfdf5;
      color: #065f46;
      border-left: 3px solid var(--primary);
    }

    .sub-list { list-style: none; background: #fff; border-top: 1px solid var(--border-color); }
    .sub-item {
      padding: 0.5rem 0.75rem 0.5rem 1.6rem;
      font-size: 0.76rem;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #f1f5f9;
    }
    .sub-item.active { background: #eff6ff; color: #0284c7; font-weight: 700; }

    .badge-free {
      background: #10b981; color: #fff; font-size: 0.6rem;
      padding: 1px 4px; border-radius: 3px; font-weight: 700;
    }

    /* Lock Overlay */
    .player-lock-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(11, 17, 32, 0.94);
      z-index: 20;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="player-header">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    <span style="font-size:0.75rem; color:var(--text-muted);" id="userActiveEmail">Member</span>
  </header>

  <div class="main-app-container">

    <!-- 1. STICKY TOP VIDEO AREA -->
    <div class="sticky-video-section">
      <div id="videoViewport" class="video-viewport">
        <!-- Anti Redirect Click Interceptors -->
        <div class="yt-shield-top"></div>
        <div class="yt-shield-logo"></div>

        <!-- Custom Safe Fullscreen Toggle Button -->
        <button id="customFsBtn" class="fs-toggle-btn">
          <i class="fa-solid fa-expand"></i> Theater View
        </button>

        <!-- Lock Card Overlay -->
        <div id="playerLockOverlay" class="player-lock-overlay">
          <i class="fa-solid fa-lock" style="font-size:1.8rem; color:#fbbf24; margin-bottom:0.4rem;"></i>
          <h3 style="font-size:1rem; color:#fff;">Chapter Locked Hai</h3>
          <p style="font-size:0.78rem; color:#94a3b8; margin:0.3rem 0 0.8rem; max-width:260px;">
            Subscription plan buy karke 300+ course roadmap unlock karein.
          </p>
          <a href="index.html#authBox" style="background:#10b981; color:#0b1120; text-decoration:none; padding:0.45rem 1rem; border-radius:5px; font-weight:700; font-size:0.78rem;">
            Unlock All Courses
          </a>
        </div>

        <iframe id="videoPlayerFrame" src="" allow="autoplay; encrypted-media" allowfullscreen="false"></iframe>
      </div>

      <!-- Compact Meta & Credit Bar -->
      <div class="video-info-bar">
        <h2 id="currentLessonTitle">Loading Chapter...</h2>
        <div class="credit-tag">
          <i class="fa-brands fa-youtube" style="color:#ef4444;"></i>
          <span>Curated from: <strong id="creatorName">Expert Channel</strong></span>
        </div>
      </div>
    </div>

    <!-- 2. SCROLLABLE PLAYLIST (Independently scrolls without moving the video) -->
    <div class="scrollable-content-section">
      <div class="playlist-head">
        <span>Roadmap Index (300+ Chapters)</span>
        <span style="color:var(--primary); font-size:0.75rem;" id="totalCounter">Loading...</span>
      </div>
      <ul id="lessonList" class="lesson-list"></ul>
    </div>

  </div>

  <script src="course.js"></script>
  <script>
    // Custom Theater Fullscreen Controller
    const fsBtn = document.getElementById("customFsBtn");
    const viewport = document.getElementById("videoViewport");

    if (fsBtn && viewport) {
      fsBtn.addEventListener("click", () => {
        const isFs = viewport.classList.toggle("is-custom-fullscreen");
        fsBtn.innerHTML = isFs 
          ? '<i class="fa-solid fa-compress"></i> Close View' 
          : '<i class="fa-solid fa-expand"></i> Theater View';
      });
    }
  </script>
</body>
</html>
