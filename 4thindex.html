<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>डिजिटल विजिटिंग कार्ड मेकर - Star Digital</title>
    <meta name="description" content="Star Digital का फ्री ऑनलाइन विजिटिंग कार्ड मेकर। अपना नाम, संपर्क और व्यवसाय दर्ज करें और तुरंत शेयर करने योग्य डिजिटल कार्ड बनाएं।">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #007bff;
            --dark-bg: #0F4C30;
            --card-text: #ffffff;
            --card-border-color: rgba(255, 255, 255, 0.25);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            color: var(--card-text);
        }

        input[type="text"], input[type="email"], input[type="tel"], input[type="number"] {
            padding: 8px 10px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #145336;
            color: var(--card-text);
            border-radius: 6px;
            width: 100%;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #38ef7d;
            box-shadow: 0 0 0 3px rgba(56, 239, 125, 0.25);
        }
        
        #cardPreview {
            width: 290px; 
            height: 175px; 
            margin: 15px auto; 
            border-radius: 12px;
            padding: 16px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 1.5px solid var(--card-border-color); 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); 
            transition: all 0.3s ease;
        }
        
        /* 3D Cursive Initial */
        #cardInitial {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px; 
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.8);
            flex-shrink: 0;
            line-height: 1;
            text-shadow: 1px 1px 0 #000, 2px 2px 0 var(--primary-color), 3px 3px 0 #000;
        }

        .name-section {
            display: flex;
            align-items: center;
            gap: 12px; 
        }

        .icon {
            width: 14px; 
            height: 14px;
            fill: currentColor; 
            margin-right: 6px;
            flex-shrink: 0;
        }
        
        #cardWatermark {
            position: absolute;
            bottom: 4px; 
            right: 8px;
            font-size: 7.5px; 
            color: rgba(255, 255, 255, 0.6); 
            font-weight: 700;
            letter-spacing: 0.5px;
            pointer-events: none;
            text-transform: uppercase;
        }

        /* Light Background Handling */
        .dark-text {
            color: #1e1e2d !important;
        }
        .dark-text #cardInitial {
            color: #1e1e2d;
            border-color: #1e1e2d;
            background-color: rgba(0, 0, 0, 0.08);
            text-shadow: 1px 1px 0 #fff, 2px 2px 0 var(--primary-color), 3px 3px 0 #fff;
        }
        .dark-text #cardWatermark {
            color: rgba(0, 0, 0, 0.4); 
        }

        .gradient-selector button {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        
        .gradient-selector button.selected {
            border-color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 8px rgba(255,255,255,0.6);
        }

        /* Gradient Presets */
        .grad-1 { background-image: linear-gradient(135deg, #1d976c 0%, #93f9b9 100%); } 
        .grad-2 { background-image: linear-gradient(135deg, #007bff 0%, #6ecbff 100%); } 
        .grad-3 { background-image: linear-gradient(135deg, #d31027 0%, #ea384d 100%); } 
        .grad-4 { background-image: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); } 
        .grad-5 { background-image: linear-gradient(135deg, #4b6cb7 0%, #182848 100%); } 
        .grad-6 { background-image: linear-gradient(135deg, #ff994d 0%, #ff5e3a 100%); } 
        .grad-7 { background-image: linear-gradient(135deg, #f09819 0%, #ff5858 100%); } 
        .grad-8 { background-image: linear-gradient(135deg, #34e89e 0%, #0f3443 100%); } 
        .grad-9 { background-image: linear-gradient(135deg, #8A2387 0%, #E94057 100%); } 
        .grad-10 { background-image: linear-gradient(135deg, #0f0c29 0%, #302b63 100%); } 
        .grad-11 { background-image: linear-gradient(135deg, #cc2b5e 0%, #753a88 100%); } 
        .grad-12 { background-image: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); } 
    </style>
</head>
<body class="p-4 pb-10">

    <header class="text-center mb-3">
        <h1 class="text-xl font-extrabold text-white">⭐️ डिजिटल बिज़नेस कार्ड मेकर</h1>
        <p class="text-xs text-emerald-200 mt-0.5">तुरंत अपना विजिटिंग कार्ड बनाएं और शेयर करें।</p>
    </header>

    <!-- Card Preview Section -->
    <div class="text-center mb-3"> 
        <div id="cardPreview" class="grad-5">
            <div class="name-section">
                <div id="cardInitial">A</div> 
                <div class="text-left overflow-hidden">
                    <h2 id="cardName" class="text-base font-bold leading-tight truncate">आपका नाम</h2>
                    <p id="cardOccupation" class="text-xs opacity-90 italic leading-tight mt-0.5 truncate">आपका व्यवसाय</p>
                </div>
                <div id="cardEmoji" class="text-2xl ml-auto flex-shrink-0">✨</div> 
            </div>

            <div class="mt-2 space-y-1 text-left text-xs font-medium opacity-95">
                <div class="flex items-center">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.74 21 3 13.26 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.46.57 3.57.11.35.03.74-.24 1.02l-2.2 2.2z"/></svg>
                    <span id="cardContact" class="truncate">9876543210</span>
                </div>
                <div class="flex items-center">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    <span id="cardEmail" class="truncate">email@example.com</span>
                </div>
                <div class="flex items-center">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    <span id="cardLocation" class="truncate">शहर, 110001</span>
                </div>
            </div>
            
            <div id="cardWatermark">STAR DIGITAL</div>
        </div>
    </div>
    
    <!-- Background Selector -->
    <div class="text-center mb-4 max-w-sm mx-auto"> 
        <h3 class="text-xs uppercase tracking-wider font-semibold mb-2 text-emerald-200">🎨 बैकग्राउंड चुनें</h3> 
        <div id="gradientSelector" class="gradient-selector flex flex-wrap justify-center gap-2"></div>
    </div>
    
    <!-- Form Inputs -->
    <div class="max-w-sm mx-auto p-4 bg-emerald-950/60 border border-emerald-800/60 rounded-xl shadow-xl"> 
        <h3 class="text-base font-semibold mb-3 text-center text-yellow-300">जानकारी भरें</h3> 
        <div class="space-y-2.5"> 
            <div>
                <label class="block text-xs font-medium mb-1 text-emerald-100">पूरा नाम *</label> 
                <input type="text" id="nameInput" placeholder="जैसे: रोहित कुमार" maxlength="30" value="आपका नाम">
            </div>

            <div class="flex space-x-2">
                <div class="w-3/4">
                    <label class="block text-xs font-medium mb-1 text-emerald-100">व्यवसाय / पद</label>
                    <input type="text" id="occupationInput" placeholder="जैसे: वेब डेवलपर" maxlength="25" value="आपका व्यवसाय">
                </div>
                <div class="w-1/4">
                    <label class="block text-xs font-medium mb-1 text-emerald-100">इमोजी</label>
                    <input type="text" id="emojiInput" placeholder="🔥" maxlength="2" value="✨">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium mb-1 text-emerald-100">मोबाइल नंबर (10 अंक) *</label>
                <input type="tel" id="contactInput" placeholder="9876543210" maxlength="10" value="9876543210">
            </div>
            
            <div>
                <label class="block text-xs font-medium mb-1 text-emerald-100">ईमेल ID</label>
                <input type="email" id="emailInput" placeholder="email@example.com" maxlength="40" value="email@example.com">
            </div>

            <div class="flex space-x-2">
                <div class="w-2/3">
                    <label class="block text-xs font-medium mb-1 text-emerald-100">शहर / स्थान</label>
                    <input type="text" id="locationInput" placeholder="जैसे: मुंबई" maxlength="20" value="शहर">
                </div>
                <div class="w-1/3">
                    <label class="block text-xs font-medium mb-1 text-emerald-100">पिन कोड</label>
                    <input type="tel" id="pincodeInput" placeholder="110001" maxlength="6" value="110001">
                </div>
            </div>
        </div>
    </div>
    
    <!-- Action Buttons -->
    <div class="max-w-sm mx-auto mt-4 flex space-x-3"> 
        <button id="downloadBtn" onclick="downloadCard()" 
                class="w-1/2 py-2.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold rounded-lg shadow-md transition duration-200 flex items-center justify-center text-sm"> 
            📥 डाउनलोड JPEG
        </button>
        <button id="shareBtn" onclick="shareCard()" 
                class="w-1/2 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-bold rounded-lg shadow-md transition duration-200 flex items-center justify-center text-sm"> 
            📲 शेयर करें
        </button>
    </div>
    
    <!-- Alert Modal -->
    <div id="customModal" class="fixed inset-0 bg-black/75 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-gray-800 border border-gray-700 p-5 rounded-xl max-w-xs w-full shadow-2xl text-center">
            <h3 id="modalTitle" class="text-base font-bold mb-2 text-yellow-300"></h3>
            <p id="modalMessage" class="text-xs text-gray-300 mb-4"></p>
            <button onclick="document.getElementById('customModal').classList.add('hidden')" class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg">
                ठीक है
            </button>
        </div>
    </div>

    <script>
        const gradientClasses = [
            'grad-1', 'grad-2', 'grad-3', 'grad-4', 'grad-5', 'grad-6',
            'grad-7', 'grad-8', 'grad-9', 'grad-10', 'grad-11', 'grad-12'
        ];
        
        const lightBackgrounds = ['grad-1', 'grad-2', 'grad-6', 'grad-7', 'grad-12'];
        let currentGradient = 'grad-5';

        const elements = {
            preview: document.getElementById('cardPreview'),
            initial: document.getElementById('cardInitial'),
            name: document.getElementById('cardName'),
            occupation: document.getElementById('cardOccupation'),
            contact: document.getElementById('cardContact'),
            email: document.getElementById('cardEmail'),
            location: document.getElementById('cardLocation'),
            emoji: document.getElementById('cardEmoji'),
            watermark: document.getElementById('cardWatermark'),
            nameInput: document.getElementById('nameInput'),
            occupationInput: document.getElementById('occupationInput'),
            contactInput: document.getElementById('contactInput'),
            emailInput: document.getElementById('emailInput'),
            locationInput: document.getElementById('locationInput'),
            pincodeInput: document.getElementById('pincodeInput'), 
            emojiInput: document.getElementById('emojiInput'),
            gradientSelector: document.getElementById('gradientSelector'),
            downloadBtn: document.getElementById('downloadBtn'),
            shareBtn: document.getElementById('shareBtn'),
        };

        function showMessage(title, message) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function getInitial(name) {
            const trimmed = name.trim();
            if (!trimmed) return 'A';
            return trimmed.charAt(0).toUpperCase();
        }

        function updateCardColorContrast() {
            const isLight = lightBackgrounds.includes(currentGradient);
            elements.preview.classList.toggle('dark-text', isLight);
        }

        function updatePreview() {
            const nameVal = elements.nameInput.value.trim();
            elements.name.innerText = nameVal || "आपका नाम";
            elements.initial.innerText = getInitial(nameVal);
            elements.occupation.innerText = elements.occupationInput.value.trim() || "आपका व्यवसाय";
            elements.contact.innerText = elements.contactInput.value.trim() || "9876543210";
            elements.email.innerText = elements.emailInput.value.trim() || "email@example.com";
            
            const city = elements.locationInput.value.trim() || "शहर";
            const pin = elements.pincodeInput.value.trim() ? `, ${elements.pincodeInput.value.trim()}` : '';
            elements.location.innerText = city + pin;
            
            elements.emoji.innerText = elements.emojiInput.value.slice(0, 2) || "✨"; 

            elements.preview.className = `${currentGradient}`;
            updateCardColorContrast();
        }

        function selectGradient(grad) {
            currentGradient = grad;
            document.querySelectorAll('#gradientSelector button').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.grad === grad);
            });
            updatePreview();
        }

        function initialize() {
            [elements.nameInput, elements.occupationInput, elements.contactInput,
             elements.emailInput, elements.locationInput, elements.emojiInput].forEach(input => {
                input.addEventListener('input', updatePreview);
            });
            
            elements.pincodeInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                updatePreview();
            });

            elements.contactInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
            });

            gradientClasses.forEach(grad => {
                const btn = document.createElement('button');
                btn.className = `${grad} rounded-full`;
                btn.dataset.grad = grad;
                btn.onclick = () => selectGradient(grad);
                elements.gradientSelector.appendChild(btn);
            });

            selectGradient(currentGradient);
        }

        function processCardCapture(action) {
            const contactNumber = elements.contactInput.value.trim();
            const nameVal = elements.nameInput.value.trim();
            
            if (!nameVal) {
                showMessage("ज़रूरी जानकारी", "कृपया नाम भरें।");
                return;
            }
            if (!contactNumber || contactNumber.length !== 10) {
                showMessage("ज़रूरी जानकारी", "कृपया 10 अंकों का सही मोबाइल नंबर भरें।");
                return;
            }

            elements.downloadBtn.disabled = true;
            elements.shareBtn.disabled = true;

            html2canvas(elements.preview, { 
                scale: 3,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                elements.downloadBtn.disabled = false;
                elements.shareBtn.disabled = false;

                const filename = `Digital_Card_${nameVal.replace(/\s+/g, '_')}.jpg`;

                if (action === 'download') {
                    const link = document.createElement("a");
                    link.download = filename;
                    link.href = canvas.toDataURL('image/jpeg', 0.95); 
                    link.click();
                    showMessage("सफलता!", "आपका डिजिटल कार्ड JPEG रूप में डाउनलोड हो गया है।");

                } else if (action === 'share') {
                    canvas.toBlob(function(blob) {
                        const file = new File([blob], filename, { type: 'image/jpeg' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            navigator.share({
                                title: 'Digital Visiting Card',
                                text: `मेरा डिजिटल विजिटिंग कार्ड देखें:`,
                                files: [file],
                            }).catch(() => {});
                        } else {
                            fallbackDownload(canvas, filename);
                            showMessage("सूचना", "सीधा शेयर उपलब्ध नहीं है, इसलिए कार्ड डाउनलोड कर दिया गया है।");
                        }
                    }, 'image/jpeg', 0.95); 
                }
            }).catch(() => {
                elements.downloadBtn.disabled = false;
                elements.shareBtn.disabled = false;
                showMessage("त्रुटि", "इमेज बनाने में समस्या आई।");
            });
        }
        
        function fallbackDownload(canvas, filename) {
            const link = document.createElement("a");
            link.download = filename;
            link.href = canvas.toDataURL('image/jpeg', 0.95); 
            link.click();
        }

        function downloadCard() {
            processCardCapture('download');
        }

        function shareCard() {
            processCardCapture('share');
        }

        window.onload = initialize;
    </script>
</body>
</html>
