    }

    /* Bottom Navigation Bar */
    .lightbox-nav-bar {
      display: flex;
      justify-content: space-between;

<body>

  <!-- Live Search Bar -->

  <!-- Filter Chips -->
  <div class="chip-scroll" id="categoryChips">

    <button class="chip-btn" onclick="selectCategory('Hadees Se Sabit', this)">Hadees Se Sabit</button>

  </div>

  <main id="duasListContainer"></main>
<!-- 🖼️ Fullscreen Dua Gallery Lightbox -->
  <div id="duaLightbox" class="dua-lightbox-overlay">
    <div class="lightbox-topbar">
      <span class="lightbox-counter" id="lbCounter">Dua 1 / 1</span>
      <button class="lightbox-close-btn" onclick="closeDuaLightbox()">✕</button>
    </div>

    <div class="lightbox-body" id="lbTouchArea">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #f1f5f9; padding-bottom:6px;">
        <span id="lbCategory" style="font-size:0.68rem; font-weight:800; color:#059669; background:#ecfdf5; padding:2px 8px; border-radius:4px;">--</span>
        <span id="lbReference" style="font-size:0.68rem; color:#64748b; font-weight:700;">--</span>
      </div>

      <h3 id="lbTitle" style="font-size:1rem; font-weight:800; color:#0f172a; margin:8px 0 0 0;">--</h3>
      <div class="lb-arabic" id="lbArabic">--</div>
      <div class="lb-translit" id="lbTranslit">--</div>

      <!-- Language Selector in Lightbox -->
      <div class="lang-tabs" style="margin-top:6px;">
        <button class="lang-tab-btn active" onclick="switchLightboxLang('urdu', this)">Urdu</button>
        <button class="lang-tab-btn" onclick="switchLightboxLang('hindi', this)">Hindi</button>
        <button class="lang-tab-btn" onclick="switchLightboxLang('eng', this)">English</button>
      </div>

      <div class="lb-tarjuma" id="lbTarjuma">--</div>
      <div id="lbBenefits" class="dua-benefit" style="margin-top:8px;"></div>
    </div>

    <!-- Gallery Navigation Buttons -->
    <div class="lightbox-nav-bar">
      <button class="lb-nav-btn" onclick="navigateLightbox(-1)">⟨ Pichli Dua</button>
      <button class="lb-nav-btn" style="background:#059669; border:none;" onclick="shareCurrentLightboxDua()">📤 Share</button>
      <button class="lb-nav-btn" onclick="navigateLightbox(1)">Agli Dua ⟩</button>
    </div>
  </div>
  <script>
    let activeCategory = 'All';
    const container = document.getElementById('duasListContainer');

    function selectCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterDuas();
    }

    // Current Active List & Lightbox Tracking
    let currentRenderedList = [];
    let currentLightboxIndex = 0;
    let currentSelectedLang = 'urdu';

    function renderDuasList(list) {
      currentRenderedList = list;
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; font-size:0.8rem; color:#94a3b8;">Koi dua nahi mili. Doosra lafz talash karein.</div>';
        return;
      }

      list.forEach((dua, index) => {
        const card = document.createElement('article');
        card.className = 'dua-card';
        card.setAttribute('itemscope', '');
        card.setAttribute('itemtype', 'https://schema.org/CreativeWork');
        // Click karne par lightbox khulega
        card.style.cursor = 'pointer';

        card.innerHTML = `
          <div class="dua-header">
            <span class="dua-cat-tag">📁 ${dua.category}</span>
            <span class="dua-ref-tag">📜 ${dua.reference}</span>
          </div>
          <h2 class="dua-title" itemprop="headline" onclick="openDuaLightbox(${index})">${dua.title} <span style="font-size:0.75rem; color:#059669;">🔍 Expand</span></h2>
          <div class="dua-arabic" onclick="openDuaLightbox(${index})">${dua.arabic}</div>
          <div class="dua-translit">${dua.transliteration}</div>

          <div class="lang-tabs">
            <button class="lang-tab-btn active" onclick="switchDuaLang(${dua.id}, 'urdu', this); event.stopPropagation();">Urdu</button>
            <button class="lang-tab-btn" onclick="switchDuaLang(${dua.id}, 'hindi', this); event.stopPropagation();">Hindi</button>
            <button class="lang-tab-btn" onclick="switchDuaLang(${dua.id}, 'eng', this); event.stopPropagation();">English</button>
          </div>

          <div class="tarjuma-text" id="tarjuma_${dua.id}">${dua.translationUrdu}</div>
          ${dua.benefits ? `<div class="dua-benefit">✨ <strong>Fazilat:</strong> ${dua.benefits}</div>` : ''}

          <div class="dua-action-bar">
            <button class="dua-btn btn-green" onclick="openDuaLightbox(${index})">🖼️ Gallery View me Kholein</button>
            <button class="dua-btn btn-outline" onclick="copyDua(${dua.id}); event.stopPropagation();">📋 Copy</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 🌟 Lightbox Controls
    function openDuaLightbox(index) {
      if (!currentRenderedList || currentRenderedList.length === 0) return;
      currentLightboxIndex = index;
      updateLightboxDisplay();
      document.getElementById('duaLightbox').classList.add('active');
      document.body.style.overflow = 'hidden'; // Page scroll lock
    }

    function closeDuaLightbox() {
      document.getElementById('duaLightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    function updateLightboxDisplay() {
      const dua = currentRenderedList[currentLightboxIndex];
      if (!dua) return;

      document.getElementById('lbCounter').innerText = `Dua ${currentLightboxIndex + 1} / ${currentRenderedList.length}`;
      document.getElementById('lbCategory').innerText = `📁 ${dua.category}`;
      document.getElementById('lbReference').innerText = `📜 ${dua.reference}`;
      document.getElementById('lbTitle').innerText = dua.title;
      document.getElementById('lbArabic').innerText = dua.arabic;
      document.getElementById('lbTranslit').innerText = dua.transliteration;

      const benEl = document.getElementById('lbBenefits');
      if (dua.benefits) {
        benEl.style.display = 'block';
        benEl.innerHTML = `✨ <strong>Fazilat:</strong> ${dua.benefits}`;
      } else {
        benEl.style.display = 'none';
      }

      applyLightboxTranslation(dua);
    }

    function applyLightboxTranslation(dua) {
      const tarjumaBox = document.getElementById('lbTarjuma');
      if (currentSelectedLang === 'urdu') tarjumaBox.innerText = dua.translationUrdu;
      if (currentSelectedLang === 'hindi') tarjumaBox.innerText = dua.translationHindi;
      if (currentSelectedLang === 'eng') tarjumaBox.innerText = dua.translationEnglish;
    }

    function switchLightboxLang(lang, btn) {
      currentSelectedLang = lang;
      btn.parentElement.querySelectorAll('.lang-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyLightboxTranslation(currentRenderedList[currentLightboxIndex]);
    }

    function navigateLightbox(direction) {
      currentLightboxIndex += direction;
      if (currentLightboxIndex < 0) currentLightboxIndex = currentRenderedList.length - 1;
      if (currentLightboxIndex >= currentRenderedList.length) currentLightboxIndex = 0;
      updateLightboxDisplay();
    }

    function shareCurrentLightboxDua() {
      const dua = currentRenderedList[currentLightboxIndex];
      if (dua) shareDua(dua.id);
    }

    // 📱 Mobile Touch Swipe Gestures (Left & Right)
    let touchStartX = 0;
    let touchEndX = 0;
    const touchArea = document.getElementById('lbTouchArea');

    touchArea.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    touchArea.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleGesture();
    }, { passive: true });

    function handleGesture() {
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 45) {
        if (diff < 0) {
          navigateLightbox(1); // Swipe Left -> Agli Dua
        } else {
          navigateLightbox(-1); // Swipe Right -> Pichli Dua
        }
      }
    }
    // Language switcher between Urdu, Hindi, and English
    function switchDuaLang(id, lang, btn) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.lang-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const targetEl = document.getElementById(`tarjuma_${id}`);
      const dua = duasDatabase.find(d => d.id === id);
      if (!dua || !targetEl) return;

      if (lang === 'urdu') targetEl.innerText = dua.translationUrdu;
      if (lang === 'hindi') targetEl.innerText = dua.translationHindi;
      if (lang === 'eng') targetEl.innerText = dua.translationEnglish;
    }

    // Fast Filter & Search
    function filterDuas() {
      const q = document.getElementById('duaSearchInput').value.toLowerCase().trim();
      const filtered = duasDatabase.filter(d => {
        const matchesCategory = (activeCategory === 'All' || d.category === activeCategory);
        const matchesSearch = !q || 
          d.title.toLowerCase().includes(q) || 
          d.translationUrdu.toLowerCase().includes(q) ||
          d.translationHindi.toLowerCase().includes(q) ||
          d.translationEnglish.toLowerCase().includes(q) ||
          d.transliteration.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });
      renderDuasList(filtered);
    }

    // Share & Copy Actions
    function shareDua(id) {
      const d = duasDatabase.find(item => item.id === id);
      if (!d) return;
      const text = `🤲 *${d.title}*\n\n${d.arabic}\n\n*Tarjuma:* "${d.translationUrdu}"\n\n*Hawala:* ${d.reference}\n\n500+ Masnoon Duain yahan padhein:\n${window.location.href}`;
      if (navigator.share) navigator.share({ title: d.title, text: text, url: window.location.href });
      else {
        navigator.clipboard.writeText(text);
        alert("Dua clipboard me copy ho gayi!");
      }
    }

    function copyDua(id) {
      const d = duasDatabase.find(item => item.id === id);
      if (!d) return;
      const text = `${d.title}\n\n${d.arabic}\n\n${d.transliteration}\n\nTarjuma: ${d.translationUrdu}\nHawala: ${d.reference}`;
      navigator.clipboard.writeText(text);
      alert("Dua copy ho gayi!");
    }

    // Initial Load
    if (typeof duasDatabase !== 'undefined') {
      renderDuasList(duasDatabase);
    }
  </script>
