<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masnoon Duain & Azkar Library | 500+ Islamic Duas with References</title>
  <meta name="description" content="500+ Masnoon Duain, Rabbana Duain, Nabiyo aur Sahaba ki Duayein ba-hawala Arabic, Roman Urdu, Hindi aur English tarjuma ke sath.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yourdomain.com/duas.html">

  <!-- JSON-LD Structured Data (Google Rich Snippet) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Masnoon Islamic Duas Directory",
    "description": "Authentic collection of Quranic and Hadith supplications in Arabic with multi-language translations.",
    "url": "https://yourdomain.com/duas.html",
    "inLanguage": ["ar", "ur-Latn", "hi", "en"]
  }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="duas-data.js"></script>
  <style>
    body { background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 14px; color: #0f172a; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .back-btn { background: #0f172a; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; }
    
    /* Search Box */
    .search-wrap { margin-bottom: 12px; }
    .search-input { width: 100%; box-sizing: border-box; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 0.8rem; font-family: inherit; outline: none; }
    .search-input:focus { border-color: #059669; }

    /* Category Filter Chips */
    .chip-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; scrollbar-width: none; }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip-btn { flex: 0 0 auto; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 20px; padding: 6px 14px; font-size: 0.72rem; font-weight: 700; color: #475569; cursor: pointer; }
    .chip-btn.active { background: #059669; color: #ffffff; border-color: #059669; }

    /* Dua Card */
    .dua-card { background: #ffffff; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1.5px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
    .dua-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .dua-cat-tag { background: #ecfdf5; color: #047857; font-size: 0.65rem; font-weight: 800; padding: 3px 8px; border-radius: 4px; }
    .dua-ref-tag { font-size: 0.68rem; color: #64748b; font-weight: 700; }
    .dua-title { font-size: 0.95rem; font-weight: 800; color: #0f172a; margin: 4px 0 10px 0; }
    
    .dua-arabic { font-family: 'Amiri', serif; font-size: 1.3rem; direction: rtl; text-align: right; color: #065f46; line-height: 2; margin-bottom: 10px; }
    .dua-translit { font-size: 0.75rem; color: #475569; font-style: italic; margin-bottom: 8px; line-height: 1.4; }

    /* Multi-language Tabs inside Card */
    .lang-tabs { display: flex; gap: 6px; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-bottom: 8px; }
    .lang-tab-btn { background: none; border: none; font-size: 0.7rem; font-weight: 700; color: #94a3b8; cursor: pointer; padding: 2px 6px; }
    .lang-tab-btn.active { color: #059669; border-bottom: 2px solid #059669; }

    .tarjuma-text { font-size: 0.78rem; line-height: 1.5; color: #1e293b; min-height: 38px; }
    .dua-benefit { font-size: 0.7rem; color: #b45309; background: #fffbeb; padding: 6px 10px; border-radius: 6px; margin-top: 10px; line-height: 1.4; }

    .dua-action-bar { display: flex; gap: 8px; margin-top: 12px; }
    .dua-btn { flex: 1; padding: 7px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; border: none; cursor: pointer; }
    .btn-green { background: #059669; color: #ffffff; }
    .btn-outline { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  </style>
</head>
<body>

  <header class="header-bar">
    <a href="index.html" class="back-btn">⬅️ Dashboard</a>
    <h1 style="font-size:0.95rem; font-weight:800; margin:0; color:#065f46;">500+ Masnoon Duain</h1>
  </header>

  <!-- Live Search Bar -->
  <div class="search-wrap">
    <input type="text" id="duaSearchInput" class="search-input" placeholder="🔍 Dua dhoondhein (e.g. Bimari, Safar, Rabbana, Karz)..." onkeyup="filterDuas()">
  </div>

  <!-- Filter Chips -->
  <div class="chip-scroll" id="categoryChips">
    <button class="chip-btn active" onclick="selectCategory('All', this)">All Duas</button>
    <button class="chip-btn" onclick="selectCategory('Rabbana Dua', this)">Rabbana Duain</button>
    <button class="chip-btn" onclick="selectCategory('Nabiyo Ki Dua', this)">Nabiyo Ki Duain</button>
    <button class="chip-btn" onclick="selectCategory('Hadees Se Sabit', this)">Hadees Se Sabit</button>
    <button class="chip-btn" onclick="selectCategory('Sahaba Ki Dua', this)">Sahaba Ki Duain</button>
  </div>

  <main id="duasListContainer"></main>

  <script>
    let activeCategory = 'All';
    const container = document.getElementById('duasListContainer');

    function selectCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterDuas();
    }

    function renderDuasList(list) {
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:30px; font-size:0.8rem; color:#94a3b8;">Koi dua nahi mili. Doosra lafz talash karein.</div>';
        return;
      }

      list.forEach(dua => {
        const card = document.createElement('article');
        card.className = 'dua-card';
        card.setAttribute('itemscope', '');
        card.setAttribute('itemtype', 'https://schema.org/CreativeWork');

        card.innerHTML = `
          <div class="dua-header">
            <span class="dua-cat-tag">📁 ${dua.category}</span>
            <span class="dua-ref-tag">📜 ${dua.reference}</span>
          </div>
          <h2 class="dua-title" itemprop="headline">${dua.title}</h2>
          <div class="dua-arabic">${dua.arabic}</div>
          <div class="dua-translit">${dua.transliteration}</div>

          <!-- Language Selector -->
          <div class="lang-tabs">
            <button class="lang-tab-btn active" onclick="switchDuaLang(${dua.id}, 'urdu', this)">Urdu</button>
            <button class="lang-tab-btn" onclick="switchDuaLang(${dua.id}, 'hindi', this)">Hindi</button>
            <button class="lang-tab-btn" onclick="switchDuaLang(${dua.id}, 'eng', this)">English</button>
          </div>

          <div class="tarjuma-text" id="tarjuma_${dua.id}">${dua.translationUrdu}</div>
          
          ${dua.benefits ? `<div class="dua-benefit">✨ <strong>Fazilat:</strong> ${dua.benefits}</div>` : ''}

          <div class="dua-action-bar">
            <button class="dua-btn btn-green" onclick="shareDua(${dua.id})">📤 WhatsApp Share</button>
            <button class="dua-btn btn-outline" onclick="copyDua(${dua.id})">📋 Copy Dua</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Language switcher between Urdu, Hindi, and English
    function switchDuaLang(id, lang, btn) {
      const parent = btn.parentElement;
      parent.querySelectorAll('.lang-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const targetEl = document.getElementById(`tarjuma_${id}`);
      const dua = duasDatabase.find(d => d.id === id);
      if (!dua || !targetEl) return;

      if (lang === 'urdu') targetEl.innerText = dua.translationUrdu;
      if (lang === 'hindi') targetEl.innerText = dua.translationHindi;
      if (lang === 'eng') targetEl.innerText = dua.translationEnglish;
    }

    // Fast Filter & Search
    function filterDuas() {
      const q = document.getElementById('duaSearchInput').value.toLowerCase().trim();
      const filtered = duasDatabase.filter(d => {
        const matchesCategory = (activeCategory === 'All' || d.category === activeCategory);
        const matchesSearch = !q || 
          d.title.toLowerCase().includes(q) || 
          d.translationUrdu.toLowerCase().includes(q) ||
          d.translationHindi.toLowerCase().includes(q) ||
          d.translationEnglish.toLowerCase().includes(q) ||
          d.transliteration.toLowerCase().includes(q);
        return matchesCategory && matchesSearch;
      });
      renderDuasList(filtered);
    }

    // Share & Copy Actions
    function shareDua(id) {
      const d = duasDatabase.find(item => item.id === id);
      if (!d) return;
      const text = `🤲 *${d.title}*\n\n${d.arabic}\n\n*Tarjuma:* "${d.translationUrdu}"\n\n*Hawala:* ${d.reference}\n\n500+ Masnoon Duain yahan padhein:\n${window.location.href}`;
      if (navigator.share) navigator.share({ title: d.title, text: text, url: window.location.href });
      else {
        navigator.clipboard.writeText(text);
        alert("Dua clipboard me copy ho gayi!");
      }
    }

    function copyDua(id) {
      const d = duasDatabase.find(item => item.id === id);
      if (!d) return;
      const text = `${d.title}\n\n${d.arabic}\n\n${d.transliteration}\n\nTarjuma: ${d.translationUrdu}\nHawala: ${d.reference}`;
      navigator.clipboard.writeText(text);
      alert("Dua copy ho gayi!");
    }

    // Initial Load
    if (typeof duasDatabase !== 'undefined') {
      renderDuasList(duasDatabase);
    }
  </script>
</body>
</html>
