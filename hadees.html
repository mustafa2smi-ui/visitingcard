    .arabic-text { font-family: 'Amiri', serif; font-size: 1.2rem; direction: rtl; text-align: right; color: #92400e; line-height: 1.8; margin: 8px 0; }
    .tarjuma-text { font-size: 0.78rem; font-weight: 600; color: #1e293b; line-height: 1.5; margin-bottom: 6px; }
    .wazahat-text { font-size: 0.72rem; color: #475569; line-height: 1.4; border-top: 1px dashed #e2e8f0; padding-top: 6px; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .action-btn { background: #10b981; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer; }

<body>

  <header class="header-bar">
    <a href="index.html" class="back-btn">⬅️ Dashboard</a>
    <h1 style="font-size:0.95rem; font-weight:800; margin:0; color:#78350f;">Hadees Sharif Archive</h1>
  </header>

  <main id="hadeesList"></main>

  <script>
    const list = document.getElementById('hadeesList');
    if (typeof hadeesDatabase !== 'undefined') {
      hadeesDatabase.forEach(item => {
        const art = document.createElement('article');
        art.className = 'hadees-card';
        art.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="ref-badge">📜 ${item.reference}</span>
          </div>
          <div class="arabic-text">${item.arabic}</div>
          <div class="tarjuma-text">"${item.tarjuma}"</div>
          <div class="wazahat-text"><strong>Wazahat:</strong> ${item.wazahat}</div>
          <div class="btn-row">
            <button class="action-btn" onclick="shareHadees('${escape(item.arabic)}', '${escape(item.tarjuma)}', '${escape(item.reference)}')">📤 WhatsApp Share</button>
          </div>
        `;
        list.appendChild(art);
      });
    }

    function shareHadees(a, t, r) {
      const arabic = unescape(a);
      const tarjuma = unescape(t);
      const ref = unescape(r);
      const txt = `📜 *Hadees-e-Mubarak*\n\n${arabic}\n\n*Tarjuma:* "${tarjuma}"\n*Hawala:* ${ref}\n\nRozana Hadees padhne ke liye:\n${window.location.href}`;
      if (navigator.share) navigator.share({ title: ref, text: txt, url: window.location.href });
      else {
        navigator.clipboard.writeText(txt);
        alert("Hadees copy ho gayi!");
      }
    }
  </script>
