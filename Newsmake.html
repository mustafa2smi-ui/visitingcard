<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWS 7AMPM - YouTube Shorts Generator</title>
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --primary: #d32f2f;
      --dark: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #292929;
      --text: #ffffff;
      --accent: #ffd700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--dark); color: var(--text); padding: 12px; font-size: 13px; }
    .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 15px; }
    
    @media(max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Left Control Panel */
    .panel { background: var(--card-bg); padding: 14px; border-radius: 10px; border: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 6px; }
    .panel-header h2 { color: var(--primary); font-size: 16px; text-transform: uppercase; }

    /* Compact Inline Row Layout */
    .inline-row { display: flex; gap: 8px; align-items: center; }
    .slim-input {
      flex: 1;
      height: 36px;
      background: var(--input-bg);
      border: 1px solid #444;
      color: #fff;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .slim-input:focus { border-color: var(--primary); }

    /* Slim Buttons */
    .btn {
      height: 36px;
      padding: 0 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #fff;
      background: var(--primary);
      transition: 0.15s;
    }
    .btn:hover { background: #b71c1c; }
    .btn-secondary { background: #37474f; }
    .btn-secondary:hover { background: #263238; }
    .btn-success { background: #2e7d32; }
    .btn-success:hover { background: #1b5e20; }
    .btn-warning { background: #e65100; }
    .btn-warning:hover { background: #bf360c; }
    .btn-danger { background: #c62828; }
    .btn:disabled { background: #555; cursor: not-allowed; }

    #statusMessage { font-size: 11px; color: var(--accent); min-height: 14px; margin-top: -4px; }

    /* Audio Section */
    .audio-box {
      background: #181818;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .select-slim {
      height: 32px;
      padding: 0 8px;
      background: #252525;
      color: #fff;
      border: 1px solid #444;
      border-radius: 5px;
      font-size: 12px;
    }

    /* Description Box */
    .desc-box {
      background: #181818;
      padding: 10px;
      border-radius: 6px;
      border: 1px dashed #444;
    }
    .desc-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .desc-box pre {
      white-space: pre-wrap;
      font-size: 11px;
      color: #bbb;
      max-height: 90px;
      overflow-y: auto;
      line-height: 1.4;
      background: #111;
      padding: 6px 8px;
      border-radius: 4px;
    }

    /* Right Preview Section */
    .preview-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    
    /* Template Controls on Top Corner */
    .template-top-bar {
      width: 340px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .slide-nav { display: flex; align-items: center; gap: 5px; font-weight: bold; font-size: 12px; color: #ccc; }
    .mini-btn { height: 26px; padding: 0 8px; font-size: 11px; }

    /* 9:16 Shorts Viewport */
    .shorts-viewport {
      width: 340px;
      height: 604px; /* 9:16 Ratio */
      background: linear-gradient(180deg, #0a0f1d 0%, #151928 60%, #111 100%);
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.85);
      border: 2px solid #333;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-header {
      background: rgba(0,0,0,0.75);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary);
    }
    .channel-logo {
      background: var(--primary);
      color: white;
      font-weight: 900;
      padding: 4px 10px;
      font-size: 14px;
      letter-spacing: 1px;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(211, 47, 47, 0.7);
    }
    .date-display { font-size: 12px; color: #ddd; font-weight: 600; }

    .news-card-body {
      padding: 16px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .news-serial {
      color: var(--accent);
      font-size: 18px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .news-headline {
      font-size: 21px;
      line-height: 1.4;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.85);
      word-break: break-word;
    }

    /* Virtual Desk Graphic */
    .studio-desk {
      height: 150px;
      background: linear-gradient(180deg, #1f1f1f 0%, #0d0d0d 100%);
      border-top: 4px solid #4a3525;
      position: relative;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding-bottom: 20px;
    }
    .radio-unit {
      width: 75px;
      height: 52px;
      background: #6d4c41;
      border-radius: 6px 6px 3px 3px;
      border: 2px solid #3e2723;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .radio-antenna {
      position: absolute;
      width: 2px;
      height: 30px;
      background: #ccc;
      top: -30px;
      left: 12px;
      transform: rotate(-15deg);
    }
    .radio-speaker {
      width: 40px;
      height: 20px;
      background: repeating-linear-gradient(0deg, #3e2723, #3e2723 2px, #5d4037 3px, #5d4037 4px);
      border-radius: 3px;
      margin-bottom: 3px;
    }
    .radio-knob { width: 10px; height: 10px; background: #d7ccc8; border-radius: 50%; }

    .laptop-unit { display: flex; flex-direction: column; align-items: center; }
    .laptop-screen {
      width: 90px;
      height: 58px;
      background: #212121;
      border: 3px solid #616161;
      border-radius: 5px 5px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 9px;
      font-weight: bold;
    }
    .laptop-base { width: 106px; height: 5px; background: #9e9e9e; border-radius: 0 0 3px 3px; }

    .ticker-bar {
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 12px;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Left Side: Systematic Slim Controls -->
  <div class="panel">
    <div class="panel-header">
      <h2>📰 News 7AMPM Controller</h2>
      <span id="slideCountBadge" style="font-size: 12px; color: var(--accent); font-weight: bold;">Templates: 0</span>
    </div>

    <!-- 1. [ URL Input ] || [ Fetch Button ] -->
    <div class="inline-row">
      <input type="url" id="urlInput" class="slim-input" placeholder="🔗 Step 1: Paste News URL link here..." />
      <button class="btn btn-secondary" id="btnFetch" onclick="handleFetchClick()">⚡ Fetch Title</button>
    </div>

    <!-- Status Message Indicator -->
    <div id="statusMessage"></div>

    <!-- 2. [ Headline Input ] || [ Add / Make Template Button ] -->
    <div class="inline-row">
      <input type="text" id="headlineInput" class="slim-input" placeholder="📝 Step 2: Headline check karein / khud likhein..." />
      <button class="btn btn-success" id="btnAddSlide" onclick="addTemplateSlide()">➕ Make Template</button>
    </div>

    <!-- 3. [ Audio Options Row ] -->
    <div class="audio-box">
      <div class="inline-row">
        <select id="voiceMode" class="select-slim" style="flex: 1;">
          <option value="neural_radio">📻 Google Hindi Male + Radio Vintage Effect</option>
          <option value="custom_speech">🗣️ Device Hindi Voice (SpeechSynthesis hi-IN)</option>
        </select>
        <button id="playBtn" class="btn btn-warning mini-btn" onclick="toggleAudioPlayback()">🎤 Play</button>
        <button class="btn btn-secondary mini-btn" onclick="stopAudioPlayback()">⏹ Stop</button>
        <button class="btn btn-secondary mini-btn" onclick="downloadRadioAudio()">📥 Audio</button>
      </div>
    </div>

    <!-- 4. [ Description Box (Top Right Copy Button) ] -->
    <div class="desc-box">
      <div class="desc-box-header">
        <strong style="font-size: 12px; color: var(--accent);">📋 YouTube Description Links:</strong>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-secondary mini-btn" onclick="copyDescription()">📋 Copy</button>
          <button class="btn btn-danger mini-btn" onclick="clearAllData()">🗑️ Reset</button>
        </div>
      </div>
      <pre id="descContent">Abhi koi link add nahi hui hai...</pre>
    </div>
  </div>

  <!-- Right Side: 9:16 Shorts Template Preview with Corner Download Buttons -->
  <div class="preview-container">
    
    <!-- Top Bar with Slide Nav & Downloads placed at Corner -->
    <div class="template-top-bar">
      <div class="slide-nav">
        <button class="btn btn-secondary mini-btn" onclick="prevSlide()">◀</button>
        <span id="slideIndicator" style="color: var(--accent);">0 / 0</span>
        <button class="btn btn-secondary mini-btn" onclick="nextSlide()">▶</button>
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="btn btn-secondary mini-btn" onclick="downloadCurrentSlide()">💾 Current</button>
        <button class="btn btn-success mini-btn" onclick="downloadAllAsZip()">📦 ZIP All</button>
      </div>
    </div>

    <!-- 9:16 Canvas Area -->
    <div class="shorts-viewport" id="captureCard">
      <!-- Top News Header -->
      <div class="top-header">
        <div class="channel-logo">NEWS 7AMPM</div>
        <div class="date-display" id="currentDate">--/--/----</div>
      </div>

      <!-- Main Headline Body -->
      <div class="news-card-body">
        <div class="news-serial" id="newsIndexText">HEADLINE #01</div>
        <div class="news-headline" id="newsHeadlineText">
          यहाँ आपकी बड़ी ब्रेकिंग हेडलाइन आएगी।
        </div>
      </div>

      <!-- Studio Desk Graphic -->
      <div class="studio-desk">
        <div class="radio-unit">
          <div class="radio-antenna"></div>
          <div class="radio-speaker"></div>
          <div class="radio-knob"></div>
        </div>
        <div class="laptop-unit">
          <div class="laptop-screen">
            <span>7AMPM</span>
          </div>
          <div class="laptop-base"></div>
        </div>
      </div>

      <!-- Ticker Footer -->
      <div class="ticker-bar">
        <span>🔴 TOP HEADLINES</span>
        <span style="font-size: 10px;">NEWS 7AMPM</span>
      </div>
    </div>
  </div>

</div>

<script>
  let newsList = [];
  let currentSlide = 0;
  let isPlaying = false;
  let currentSpeech = null;
  let audioContext = null;
  let activeAudioSource = null;
  let radioNoiseNode = null;

  // 1. Current Date
  function setTodayDate() {
    const today = new Date();
    const options = { day: '2-digit', month: 'short', year: 'numeric' };
    document.getElementById('currentDate').innerText = today.toLocaleDateString('en-GB', options).toUpperCase();
  }
  setTodayDate();

  // 2. Auto Fetch Title on Paste
  const urlInput = document.getElementById('urlInput');
  urlInput.addEventListener('paste', () => {
    setTimeout(() => {
      handleFetchClick();
    }, 150);
  });

  // Smart Title Fetcher
  async function fetchTitleFromUrl(url) {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl);
    if (!res.ok) throw new Error("Network error");
    const data = await res.json();
    
    const parser = new DOMParser();
    const doc = parser.parseFromString(data.contents, "text/html");

    // Check meta tags first because <title> often has generic words like "World"
    let title = doc.querySelector('meta[property="og:title"]')?.content ||
                doc.querySelector('meta[name="twitter:title"]')?.content ||
                doc.querySelector('h1')?.innerText ||
                doc.querySelector('title')?.innerText || "";

    // Clean common channel names and clutter
    title = title.replace(/\s*[\-\|]\s*(BBC News|NDTV|Aaj Tak|ABP News|Dainik Bhaskar|India Today|Zee News|CNN|Reuters).*$/i, '').trim();
    
    // Agar title bohot chota ho (jaise sirf "World"), to H1 ya second header dhoondein
    if (title.length < 8) {
      let h1Text = doc.querySelector('h1')?.innerText?.trim();
      if (h1Text && h1Text.length > 8) title = h1Text;
    }

    return title;
  }

  async function handleFetchClick() {
    const url = urlInput.value.trim();
    if (!url || !url.startsWith('http')) {
      return;
    }

    const statusEl = document.getElementById('statusMessage');
    const fetchBtn = document.getElementById('btnFetch');
    statusEl.innerText = "⏳ Fetching headline from link...";
    fetchBtn.disabled = true;

    try {
      const fetchedTitle = await fetchTitleFromUrl(url);
      if (fetchedTitle) {
        document.getElementById('headlineInput').value = fetchedTitle;
        statusEl.innerText = "✅ Headline fetched! Agar badalna ho to edit karein, phir 'Make Template' dabayein.";
      } else {
        statusEl.innerText = "⚠️ Direct headline nahi mili, kripya manually likhein.";
      }
    } catch (e) {
      statusEl.innerText = "⚠️ Link fetch nahi ho saka. Headline manually daal dijiye.";
    } finally {
      fetchBtn.disabled = false;
    }
  }

  // 3. Make / Add Template Button Click
  function addTemplateSlide() {
    const headline = document.getElementById('headlineInput').value.trim();
    const url = document.getElementById('urlInput').value.trim();
    const statusEl = document.getElementById('statusMessage');

    if (!headline) {
      alert("Kripya Headline box me text likhein ya link fetch karein!");
      return;
    }

    if (newsList.length >= 10) {
      alert("Aap maximum 10 templates hi add kar sakte hain!");
      return;
    }

    // Add to Array
    const nextIndex = newsList.length + 1;
    newsList.push({
      index: nextIndex,
      headline: headline,
      link: url || "Direct News Update"
    });

    // Reset Inputs for next news
    document.getElementById('urlInput').value = "";
    document.getElementById('headlineInput').value = "";
    statusEl.innerText = `✅ Headline #${nextIndex} jud gayi! Agli news paste karein.`;
    document.getElementById('slideCountBadge').innerText = `Templates: ${newsList.length}`;

    // Update YouTube Description Box
    updateDescription();

    // Render Preview
    currentSlide = newsList.length - 1;
    renderSlide(currentSlide);
  }

  // 4. Update Description Box
  function updateDescription() {
    let desc = "⚡ NEWS 7AMPM - Today's Top Headlines Sources:\n\n";
    newsList.forEach(item => {
      desc += `${item.index}. ${item.headline}\n🔗 Link: ${item.link}\n\n`;
    });
    document.getElementById('descContent').innerText = desc;
  }

  // 5. Render Slide Preview
  function renderSlide(index) {
    if (newsList.length === 0) {
      document.getElementById('newsIndexText').innerText = "HEADLINE #01";
      document.getElementById('newsHeadlineText').innerText = "यहाँ आपकी बड़ी ब्रेकिंग हेडलाइन आएगी।";
      document.getElementById('slideIndicator').innerText = "0 / 0";
      return;
    }
    const item = newsList[index];
    document.getElementById('newsIndexText').innerText = `HEADLINE #${String(item.index).padStart(2, '0')}`;
    document.getElementById('newsHeadlineText').innerText = item.headline;
    document.getElementById('slideIndicator').innerText = `${index + 1} / ${newsList.length}`;
  }

  function nextSlide() {
    if (newsList.length === 0) return;
    currentSlide = (currentSlide + 1) % newsList.length;
    renderSlide(currentSlide);
  }

  function prevSlide() {
    if (newsList.length === 0) return;
    currentSlide = (currentSlide - 1 + newsList.length) % newsList.length;
    renderSlide(currentSlide);
  }

  // 6. Download Current Template
  async function downloadCurrentSlide() {
    if (newsList.length === 0) {
      alert("Pehle koi template add karein!");
      return;
    }
    const card = document.getElementById('captureCard');
    const canvas = await html2canvas(card, { scale: 3, useCORS: true });
    canvas.toBlob(blob => {
      saveAs(blob, `NEWS_7AMPM_Slide_${currentSlide + 1}_${Date.now()}.png`);
    });
  }

  // 7. Download All Templates as ZIP
  async function downloadAllAsZip() {
    if (newsList.length === 0) {
      alert("Pehle templates add karein!");
      return;
    }

    const statusEl = document.getElementById('statusMessage');
    statusEl.innerText = "⏳ ZIP file download ho rahi hai...";

    const zip = new JSZip();
    const folder = zip.folder("NEWS_7AMPM_Shorts");
    const card = document.getElementById('captureCard');
    const originalSlide = currentSlide;

    for (let i = 0; i < newsList.length; i++) {
      renderSlide(i);
      await new Promise(r => setTimeout(r, 200));

      const canvas = await html2canvas(card, { scale: 3, useCORS: true });
      const imgData = canvas.toDataURL('image/png').split(',')[1];
      folder.file(`Slide_${i + 1}.png`, imgData, { base64: true });
    }

    renderSlide(originalSlide);
    const zipBlob = await zip.generateAsync({ type: "blob" });
    saveAs(zipBlob, `NEWS_7AMPM_All_Slides_${Date.now()}.zip`);
    statusEl.innerText = "✅ ZIP download complete!";
  }

  // 8. Audio Broadcast Logic
  function getBroadcastFullText() {
    let broadcast = "News 7AMPM me aapka swagat hai. Aaj ki mukhya khabrein. ";
    newsList.forEach(item => {
      broadcast += `Khabar number ${item.index}. ${item.headline}. `;
    });
    return broadcast;
  }

  function toggleAudioPlayback() {
    if (newsList.length === 0) {
      alert("Pehle headline add karein!");
      return;
    }

    if (isPlaying) {
      stopAudioPlayback();
    } else {
      const mode = document.getElementById('voiceMode').value;
      if (mode === 'custom_speech') {
        playDeviceHindiVoice(getBroadcastFullText());
      } else {
        playNeuralRadioStream(getBroadcastFullText());
      }
    }
  }

  function playDeviceHindiVoice(text) {
    if (!("speechSynthesis" in window)) {
      alert("Aapka device TTS support nahi karta.");
      return;
    }
    stopAudioPlayback();

    currentSpeech = new SpeechSynthesisUtterance(text);
    currentSpeech.lang = "hi-IN";
    currentSpeech.pitch = 0.85;
    currentSpeech.rate = 0.95;

    currentSpeech.onend = () => {
      isPlaying = false;
      document.getElementById('playBtn').textContent = "🎤 Play";
    };

    speechSynthesis.speak(currentSpeech);
    isPlaying = true;
    document.getElementById('playBtn').textContent = "⏹ Stop";
  }

  function playNeuralRadioStream(text) {
    stopAudioPlayback();
    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    const bufferSize = audioContext.sampleRate * 2;
    const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = (Math.random() * 2 - 1) * 0.012;
    }

    radioNoiseNode = audioContext.createBufferSource();
    radioNoiseNode.buffer = noiseBuffer;
    radioNoiseNode.loop = true;

    const bandpass = audioContext.createBiquadFilter();
    bandpass.type = "bandpass";
    bandpass.frequency.value = 1600;
    bandpass.Q.value = 1.3;

    radioNoiseNode.connect(bandpass);
    bandpass.connect(audioContext.destination);
    radioNoiseNode.start();

    const cleanText = encodeURIComponent(text.substring(0, 300));
    const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=hi&client=tw-ob&q=${cleanText}`;
    
    const audioEl = new Audio(audioUrl);
    activeAudioSource = audioEl;

    const source = audioContext.createMediaElementSource(audioEl);
    source.connect(bandpass);

    audioEl.play().catch(e => {
      playDeviceHindiVoice(text);
    });

    audioEl.onended = () => {
      stopAudioPlayback();
    };

    isPlaying = true;
    document.getElementById('playBtn').textContent = "⏹ Stop";
  }

  function stopAudioPlayback() {
    if (window.speechSynthesis && speechSynthesis.speaking) {
      speechSynthesis.cancel();
    }
    if (activeAudioSource) {
      activeAudioSource.pause();
      activeAudioSource = null;
    }
    if (radioNoiseNode) {
      try { radioNoiseNode.stop(); } catch(e) {}
      radioNoiseNode = null;
    }
    if (audioContext && audioContext.state !== 'closed') {
      audioContext.close();
      audioContext = null;
    }
    isPlaying = false;
    document.getElementById('playBtn').textContent = "🎤 Play";
  }

  async function downloadRadioAudio() {
    if (newsList.length === 0) {
      alert("Pehle headline add karein!");
      return;
    }
    const text = encodeURIComponent(getBroadcastFullText().substring(0, 300));
    const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=hi&client=tw-ob&q=${text}`;
    try {
      const res = await fetch(audioUrl);
      const blob = await res.blob();
      saveAs(blob, `NEWS_7AMPM_Audio_${Date.now()}.mp3`);
    } catch(e) {
      alert("Direct audio download me dikkat aane par Play karke use karein.");
    }
  }

  function copyDescription() {
    const text = document.getElementById('descContent').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("YouTube Description copy ho gaya!");
    });
  }

  function clearAllData() {
    if (confirm("Kya aap saari add ki gayi news delete karna chahte hain?")) {
      newsList = [];
      currentSlide = 0;
      document.getElementById('urlInput').value = "";
