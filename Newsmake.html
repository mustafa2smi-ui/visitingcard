<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEWS 7AMPM - Pro Shorts Studio</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <style>
    :root {
      --primary: #e50914;
      --primary-glow: rgba(229, 9, 20, 0.4);
      --dark: #0f1115;
      --card-bg: #181b22;
      --input-bg: #222631;
      --text: #ffffff;
      --accent: #ffd700;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--dark); color: var(--text); padding: 12px; font-size: 13px; }
    .container { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 15px; }
    
    @media(max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Left Control Panel */
    .panel { background: var(--card-bg); padding: 14px; border-radius: 12px; border: 1px solid #2a303c; display: flex; flex-direction: column; gap: 10px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a303c; padding-bottom: 8px; }
    .panel-header h2 { color: var(--primary); font-size: 16px; text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }

    /* Inline Controls */
    .inline-row { display: flex; gap: 8px; align-items: center; }
    .slim-input {
      flex: 1;
      height: 36px;
      background: var(--input-bg);
      border: 1px solid #363d4e;
      color: #fff;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .slim-input:focus { border-color: var(--primary); }

    .btn {
      height: 36px;
      padding: 0 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: #fff;
      background: var(--primary);
      transition: 0.15s;
    }
    .btn:hover { background: #b70710; }
    .btn-secondary { background: #374151; }
    .btn-secondary:hover { background: #1f2937; }
    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }
    .btn-warning { background: #d97706; }
    .btn-warning:hover { background: #b45309; }
    .btn-danger { background: #dc2626; }
    .btn:disabled { background: #4b5563; cursor: not-allowed; }
    .mini-btn { height: 28px; padding: 0 10px; font-size: 11px; }

    #statusMessage { font-size: 11px; color: var(--accent); min-height: 14px; margin-top: -4px; }

    /* Background Switcher Tab */
    .bg-switcher {
      background: #11141a;
      border: 1px solid #282f3d;
      padding: 8px 10px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bg-radio-group { display: flex; gap: 14px; align-items: center; font-size: 12px; }
    .bg-radio-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #ddd; }

    /* Audio Box */
    .audio-box {
      background: #11141a;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #282f3d;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .select-slim {
      height: 32px;
      padding: 0 8px;
      background: var(--input-bg);
      color: #fff;
      border: 1px solid #363d4e;
      border-radius: 6px;
      font-size: 12px;
    }

    /* Description Box */
    .desc-box { background: #11141a; padding: 10px; border-radius: 8px; border: 1px dashed #363d4e; }
    .desc-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .desc-box pre {
      white-space: pre-wrap;
      font-size: 11px;
      color: #bbb;
      max-height: 90px;
      overflow-y: auto;
      line-height: 1.4;
      background: #090a0d;
      padding: 6px 8px;
      border-radius: 4px;
    }

    /* Right Preview Section */
    .preview-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    
    .template-top-bar {
      width: 340px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #2a303c;
    }
    .slide-nav { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 12px; color: #ccc; }

    /* 9:16 Canvas Frame */
    .shorts-viewport {
      width: 340px;
      height: 604px; /* 9:16 Frame */
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 35px rgba(0,0,0,0.9);
      border: 2px solid #2a303c;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, #090d16 0%, #111726 60%, #08090d 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Custom AI Image Layer Overlay for High Text Readability */
    .viewport-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(8,11,18,0.75) 0%, rgba(8,11,18,0.3) 40%, rgba(8,11,18,0.85) 85%);
      pointer-events: none;
      z-index: 1;
    }

    /* Top Bar */
    .top-header {
      position: relative;
      z-index: 2;
      background: rgba(10, 14, 23, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary);
    }
    .channel-logo {
      background: linear-gradient(90deg, #e50914, #ff3d00);
      color: white;
      font-weight: 900;
      padding: 4px 10px;
      font-size: 14px;
      letter-spacing: 1.5px;
      border-radius: 4px;
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .date-display { font-size: 12px; color: #e2e8f0; font-weight: 700; letter-spacing: 0.5px; }

    /* Middle Glassmorphism Headline Card */
    .news-card-body {
      position: relative;
      z-index: 2;
      padding: 16px;
      margin: 0 14px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 4px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .news-serial {
      color: var(--accent);
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .news-serial::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }
    .news-headline {
      font-size: 20px;
      line-height: 1.45;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1px 2px 4px rgba(0,0,0,0.9);
      word-break: break-word;
    }

    /* Default Studio Graphics Layer (Desk + Radio + Laptop) */
    .studio-desk {
      position: relative;
      z-index: 2;
      height: 140px;
      background: linear-gradient(180deg, #18191f 0%, #0d0d11 100%);
      border-top: 4px solid #452c1e;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding-bottom: 16px;
      box-shadow: inset 0 8px 15px rgba(0,0,0,0.7);
    }
    .radio-unit {
      width: 70px;
      height: 48px;
      background: #5d4037;
      border-radius: 6px 6px 3px 3px;
      border: 2px solid #3e2723;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .radio-antenna {
      position: absolute;
      width: 2px;
      height: 28px;
      background: #ccc;
      top: -28px;
      left: 10px;
      transform: rotate(-15deg);
    }
    .radio-speaker {
      width: 36px;
      height: 18px;
      background: repeating-linear-gradient(0deg, #3e2723, #3e2723 2px, #4e342e 3px, #4e342e 4px);
      border-radius: 3px;
      margin-bottom: 2px;
    }
    .radio-knob { width: 9px; height: 9px; background: #d7ccc8; border-radius: 50%; }

    .laptop-unit { display: flex; flex-direction: column; align-items: center; }
    .laptop-screen {
      width: 85px;
      height: 54px;
      background: #111827;
      border: 3px solid #4b5563;
      border-radius: 5px 5px 0 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .laptop-base { width: 100px; height: 5px; background: #9ca3af; border-radius: 0 0 3px 3px; }

    /* Footer Breaking Ticker */
    .ticker-bar {
      position: relative;
      z-index: 2;
      background: linear-gradient(90deg, #b70710, #e50914);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      box-shadow: 0 -2px 10px rgba(229, 9, 20, 0.4);
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Left Side: Controls -->
  <div class="panel">
    <div class="panel-header">
      <h2>NEWS 7AMPM PRO STUDIO</h2>
      <span id="slideCountBadge" style="font-size: 12px; color: var(--accent); font-weight: bold;">Templates: 0</span>
    </div>

    <!-- Background Switcher (Studio vs Custom 3D AI Image) -->
    <div class="bg-switcher">
      <div class="bg-radio-group">
        <strong style="color: var(--accent);">Theme:</strong>
        <label>
          <input type="radio" name="bgType" value="studio" checked onchange="toggleBackgroundMode('studio')">
          🏛️ 3D Studio Desk
        </label>
        <label>
          <input type="radio" name="bgType" value="custom" onchange="toggleBackgroundMode('custom')">
          🖼️ Custom AI 3D Image
        </label>
      </div>
      <div id="fileUploadRow" style="display: none; margin-top: 4px;">
        <input type="file" id="bgUploader" accept="image/*" class="slim-input" style="padding-top: 5px;" onchange="loadCustomBackgroundImage(event)">
      </div>
    </div>

    <!-- Step 1: URL Input -->
    <div class="inline-row">
      <input type="url" id="urlInput" class="slim-input" placeholder="🔗 Step 1: Paste news link..." />
      <button class="btn btn-secondary" id="btnFetch" onclick="handleFetchClick()">⚡ Fetch Title</button>
    </div>

    <div id="statusMessage"></div>

    <!-- Step 2: Headline Input -->
    <div class="inline-row">
      <input type="text" id="headlineInput" class="slim-input" placeholder="📝 Step 2: Headline check / edit karein..." />
      <button class="btn btn-success" id="btnAddSlide" onclick="addTemplateSlide()">➕ Make Template</button>
    </div>

    <!-- Audio Section -->
    <div class="audio-box">
      <div class="inline-row">
        <select id="voiceMode" class="select-slim" style="flex: 1;">
          <option value="neural_radio">📻 Google Hindi Male + Radio Vintage Filter</option>
          <option value="custom_speech">🗣️ Device Hindi Voice (SpeechSynthesis hi-IN)</option>
        </select>
        <button id="playBtn" class="btn btn-warning mini-btn" onclick="toggleAudioPlayback()">🎤 Play</button>
        <button class="btn btn-secondary mini-btn" onclick="stopAudioPlayback()">⏹ Stop</button>
        <button class="btn btn-secondary mini-btn" onclick="downloadRadioAudio()">📥 Audio</button>
      </div>
    </div>

    <!-- YouTube Description Box -->
    <div class="desc-box">
      <div class="desc-box-header">
        <strong style="font-size: 12px; color: var(--accent);">📋 YouTube Description Links:</strong>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-secondary mini-btn" onclick="copyDescription()">📋 Copy</button>
          <button class="btn btn-danger mini-btn" onclick="clearAllData()">🗑️ Reset</button>
        </div>
      </div>
      <pre id="descContent">Abhi koi link add nahi hui hai...</pre>
    </div>
  </div>

  <!-- Right Side: 9:16 Shorts Template Preview -->
  <div class="preview-container">
    
    <!-- Navigation & Corner Download Buttons -->
    <div class="template-top-bar">
      <div class="slide-nav">
        <button class="btn btn-secondary mini-btn" onclick="prevSlide()">◀</button>
        <span id="slideIndicator" style="color: var(--accent);">0 / 0</span>
        <button class="btn btn-secondary mini-btn" onclick="nextSlide()">▶</button>
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="btn btn-secondary mini-btn" onclick="downloadCurrentSlide()">💾 Current</button>
        <button class="btn btn-success mini-btn" onclick="downloadAllAsZip()">📦 ZIP All</button>
      </div>
    </div>

    <!-- 9:16 Viewport Canvas Frame -->
    <div class="shorts-viewport" id="captureCard">
      <!-- Dark overlay for readability over custom AI images -->
      <div class="viewport-overlay" id="customOverlay" style="display: none;"></div>

      <!-- Top Header -->
      <div class="top-header">
        <div class="channel-logo">NEWS 7AMPM</div>
        <div class="date-display" id="currentDate">--/--/----</div>
      </div>

      <!-- Middle Headline Glass Card -->
      <div class="news-card-body">
        <div class="news-serial" id="newsIndexText">HEADLINE #01</div>
        <div class="news-headline" id="newsHeadlineText">
          यहाँ आपकी बड़ी ब्रेकिंग हेडलाइन आएगी।
        </div>
      </div>

      <!-- Default Studio Graphic Desk (Hides in Custom Image mode) -->
      <div class="studio-desk" id="studioDeskGraphic">
        <div class="radio-unit">
          <div class="radio-antenna"></div>
          <div class="radio-speaker"></div>
          <div class="radio-knob"></div>
        </div>
        <div class="laptop-unit">
          <div class="laptop-screen">
            <span>NEWS 7AMPM</span>
          </div>
          <div class="laptop-base"></div>
        </div>
      </div>

      <!-- Ticker Footer -->
      <div class="ticker-bar">
        <span>🔴 TOP HEADLINES</span>
        <span style="font-size: 10px;">NEWS 7AMPM</span>
      </div>
    </div>
  </div>

</div>

<script>
  let newsList = [];
  let currentSlide = 0;
  let customBgDataUrl = null;
  let currentBgMode = 'studio';

  let isPlaying = false;
  let currentSpeech = null;
  let audioContext = null;
  let activeAudioSource = null;
  let radioNoiseNode = null;

  function setTodayDate() {
    const today = new Date();
    const options = { day: '2-digit', month: 'short', year: 'numeric' };
    document.getElementById('currentDate').innerText = today.toLocaleDateString('en-GB', options).toUpperCase();
  }
  setTodayDate();

  // Background Switcher Logic
  function toggleBackgroundMode(mode) {
    currentBgMode = mode;
    const fileUploadRow = document.getElementById('fileUploadRow');
    const studioDesk = document.getElementById('studioDeskGraphic');
    const customOverlay = document.getElementById('customOverlay');
    const card = document.getElementById('captureCard');

    if (mode === 'custom') {
      fileUploadRow.style.display = 'block';
      studioDesk.style.display = 'none';
      customOverlay.style.display = 'block';
      if (customBgDataUrl) {
        card.style.backgroundImage = `url('${customBgDataUrl}')`;
      }
    } else {
      fileUploadRow.style.display = 'none';
      studioDesk.style.display = 'flex';
      customOverlay.style.display = 'none';
      card.style.backgroundImage = 'none';
    }
  }

  function loadCustomBackgroundImage(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        customBgDataUrl = evt.target.result;
        document.getElementById('captureCard').style.backgroundImage = `url('${customBgDataUrl}')`;
      };
      reader.readAsDataURL(file);
    }
  }

  // Paste Event for Instant Link Fetch
  const urlInput = document.getElementById('urlInput');
  urlInput.addEventListener('paste', () => {
    setTimeout(handleFetchClick, 150);
  });

  async function fetchTitleFromUrl(url) {
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const res = await fetch(proxyUrl);
    if (!res.ok) throw new Error("Network error");
    const data = await res.json();
    
    const parser = new DOMParser();
    const doc = parser.parseFromString(data.contents, "text/html");

    let title = doc.querySelector('meta[property="og:title"]')?.content ||
                doc.querySelector('meta[name="twitter:title"]')?.content ||
                doc.querySelector('h1')?.innerText ||
                doc.querySelector('title')?.innerText || "";

    title = title.replace(/\s*[\-\|]\s*(BBC News|NDTV|Aaj Tak|ABP News|Dainik Bhaskar|India Today|Zee News|CNN|Reuters).*$/i, '').trim();
    if (title.length < 8) {
      let h1Text = doc.querySelector('h1')?.innerText?.trim();
      if (h1Text && h1Text.length > 8) title = h1Text;
    }
    return title;
  }

  async function handleFetchClick() {
    const url = urlInput.value.trim();
    if (!url || !url.startsWith('http')) return;

    const statusEl = document.getElementById('statusMessage');
    const fetchBtn = document.getElementById('btnFetch');
    statusEl.innerText = "⏳ Fetching headline from link...";
    fetchBtn.disabled = true;

    try {
      const fetchedTitle = await fetchTitleFromUrl(url);
      if (fetchedTitle) {
        document.getElementById('headlineInput').value = fetchedTitle;
        statusEl.innerText = "✅ Headline auto-fetched! Edit karke 'Make Template' dabayein.";
      } else {
        statusEl.innerText = "⚠️ Direct headline nahi mili, kripya manually likhein.";
      }
    } catch (e) {
      statusEl.innerText = "⚠️ Link fetch nahi ho saka. Headline manually daal dijiye.";
    } finally {
      fetchBtn.disabled = false;
    }
  }

  function addTemplateSlide() {
    const headline = document.getElementById('headlineInput').value.trim();
    const url = document.getElementById('urlInput').value.trim();
    const statusEl = document.getElementById('statusMessage');

    if (!headline) {
      alert("Kripya Headline box me text likhein!");
      return;
    }
    if (newsList.length >= 10) {
      alert("Maximum 10 templates hi add kar sakte hain!");
      return;
    }

    const nextIndex = newsList.length + 1;
    newsList.push({
      index: nextIndex,
      headline: headline,
      link: url || "Direct News Update"
    });

    document.getElementById('urlInput').value = "";
    document.getElementById('headlineInput').value = "";
    statusEl.innerText = `✅ Headline #${nextIndex} jud gayi!`;
    document.getElementById('slideCountBadge').innerText = `Templates: ${newsList.length}`;

    updateDescription();
    currentSlide = newsList.length - 1;
    renderSlide(currentSlide);
  }

  function updateDescription() {
    let desc = "⚡ NEWS 7AMPM - Today's Top Headlines Sources:\n\n";
    newsList.forEach(item => {
      desc += `${item.index}. ${item.headline}\n🔗 Source: ${item.link}\n\n`;
    });
    document.getElementById('descContent').innerText = desc;
  }

  function renderSlide(index) {
    if (newsList.length === 0) {
      document.getElementById('newsIndexText').innerText = "HEADLINE #01";
      document.getElementById('newsHeadlineText').innerText = "यहाँ आपकी बड़ी ब्रेकिंग हेडलाइन आएगी।";
      document.getElementById('slideIndicator').innerText = "0 / 0";
      return;
    }
    const item = newsList[index];
    document.getElementById('newsIndexText').innerText = `HEADLINE #${String(item.index).padStart(2, '0')}`;
    document.getElementById('newsHeadlineText').innerText = item.headline;
    document.getElementById('slideIndicator').innerText = `${index + 1} / ${newsList.length}`;
  }

  function nextSlide() {
    if (newsList.length === 0) return;
    currentSlide = (currentSlide + 1) % newsList.length;
    renderSlide(currentSlide);
  }

  function prevSlide() {
    if (newsList.length === 0) return;
    currentSlide = (currentSlide - 1 + newsList.length) % newsList.length;
    renderSlide(currentSlide);
  }

  async function downloadCurrentSlide() {
    if (newsList.length === 0) {
      alert("Pehle template add karein!");
      return;
    }
    const card = document.getElementById('captureCard');
    const canvas = await html2canvas(card, { scale: 3, useCORS: true });
    canvas.toBlob(blob => {
      saveAs(blob, `NEWS_7AMPM_Slide_${currentSlide + 1}_${Date.now()}.png`);
    });
  }

  async function downloadAllAsZip() {
    if (newsList.length === 0) {
      alert("Pehle templates add karein!");
      return;
    }

    const statusEl = document.getElementById('statusMessage');
    statusEl.innerText = "⏳ ZIP file download ho rahi hai...";

    const zip = new JSZip();
    const folder = zip.folder("NEWS_7AMPM_Shorts");
    const card = document.getElementById('captureCard');
    const originalSlide = currentSlide;

    for (let i = 0; i < newsList.length; i++) {
      renderSlide(i);
      await new Promise(r => setTimeout(r, 200));

      const canvas = await html2canvas(card, { scale: 3, useCORS: true });
      const imgData = canvas.toDataURL('image/png').split(',')[1];
      folder.file(`Slide_${i + 1}.png`, imgData, { base64: true });
    }

    renderSlide(originalSlide);
    const zipBlob = await zip.generateAsync({ type: "blob" });
    saveAs(zipBlob, `NEWS_7AMPM_All_Slides_${Date.now()}.zip`);
    statusEl.innerText = "✅ ZIP download complete!";
  }

  // Audio Playback & Downloader
  function getBroadcastFullText() {
    let broadcast = "News 7AMPM me aapka swagat hai. Aaj ki badi khabrein. ";
    newsList.forEach(item => {
      broadcast += `Khabar number ${item.index}. ${item.headline}. `;
    });
    return broadcast;
  }

  function toggleAudioPlayback() {
    if (newsList.length === 0) {
      alert("Pehle news add karein!");
      return;
    }
    if (isPlaying) {
      stopAudioPlayback();
    } else {
      const mode = document.getElementById('voiceMode').value;
      if (mode === 'custom_speech') {
        playDeviceHindiVoice(getBroadcastFullText());
      } else {
        playNeuralRadioStream(getBroadcastFullText());
      }
    }
  }

  function playDeviceHindiVoice(text) {
    if (!("speechSynthesis" in window)) return;
    stopAudioPlayback();
    currentSpeech = new SpeechSynthesisUtterance(text);
    currentSpeech.lang = "hi-IN";
    currentSpeech.pitch = 0.85;
    currentSpeech.rate = 0.95;

    currentSpeech.onend = () => {
      isPlaying = false;
      document.getElementById('playBtn').textContent = "🎤 Play";
    };
    speechSynthesis.speak(currentSpeech);
    isPlaying = true;
    document.getElementById('playBtn').textContent = "⏹ Stop";
  }

  function playNeuralRadioStream(text) {
    stopAudioPlayback();
    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    const bufferSize = audioContext.sampleRate * 2;
    const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = (Math.random() * 2 - 1) * 0.012;
    }

    radioNoiseNode = audioContext.createBufferSource();
    radioNoiseNode.buffer = noiseBuffer;
    radioNoiseNode.loop = true;

    const bandpass = audioContext.createBiquadFilter();
    bandpass.type = "bandpass";
    bandpass.frequency.value = 1600;
    bandpass.Q.value = 1.3;

    radioNoiseNode.connect(bandpass);
    bandpass.connect(audioContext.destination);
    radioNoiseNode.start();

    const cleanText = encodeURIComponent(text.substring(0, 300));
    const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=hi&client=tw-ob&q=${cleanText}`;
    
    const audioEl = new Audio(audioUrl);
    activeAudioSource = audioEl;

    const source = audioContext.createMediaElementSource(audioEl);
    source.connect(bandpass);
    audioEl.play().catch(() => playDeviceHindiVoice(text));
    audioEl.onended = stopAudioPlayback;

    isPlaying = true;
    document.getElementById('playBtn').textContent = "⏹ Stop";
  }

  function stopAudioPlayback() {
    if (window.speechSynthesis && speechSynthesis.speaking) speechSynthesis.cancel();
    if (activeAudioSource) { activeAudioSource.pause(); activeAudioSource = null; }
    if (radioNoiseNode) { try { radioNoiseNode.stop(); } catch(e){} radioNoiseNode = null; }
    if (audioContext && audioContext.state !== 'closed') { audioContext.close(); audioContext = null; }
    isPlaying = false;
    document.getElementById('playBtn').textContent = "🎤 Play";
  }

  async function downloadRadioAudio() {
    if (newsList.length === 0) {
      alert("Pehle news add karein!");
      return;
    }
    const text = encodeURIComponent(getBroadcastFullText().substring(0, 300));
    const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=hi&client=tw-ob&q=${text}`;
    try {
      const res = await fetch(audioUrl);
      const blob = await res.blob();
      saveAs(blob, `NEWS_7AMPM_Audio_${Date.now()}.mp3`);
    } catch(e) {
      alert("Direct audio download me dikkat hone par screen recorder se audio save kar sakte hain.");
    }
  }

  function copyDescription() {
    navigator.clipboard.writeText(document.getElementById('descContent').innerText).then(() => {
      alert("YouTube Description copied!");
    });
  }

  function clearAllData() {
    if (confirm("Kya aap saari news reset karna chahte hain?")) {
      newsList = [];
      currentSlide = 0;
      document.getElementById('urlInput').value = "";
      document.getElementById('headlineInput').value = "";
      document.getElementById('descContent').innerText = "Abhi koi link add nahi hui hai...";
      document.getElementById('slideCountBadge').innerText = "Templates: 0";
      document.getElementById('statusMessage').innerText = "";
      renderSlide(0);
    }
  }
</script>
