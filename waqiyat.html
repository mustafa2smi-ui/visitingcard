<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabak Amooz Waqiat Archive | Deeni Kahaniyan & Sabaq</title>
  <meta name="description" content="Nasihat aameez Islami waqiat, buzurgan-e-deen ke kisse aur rooh parwar kahaniyan sabaq aur hawale ke sath.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://yourdomain.com/waqiat.html">

  <!-- JSON-LD Structured Data for Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Sabak Amooz Islami Waqiat",
    "description": "Collection of inspirational and moral Islamic stories.",
    "url": "https://yourdomain.com/waqiat.html"
  }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="islamic-content-data.js"></script>
  <style>
    body { background: #f1f5f9; font-family: 'Inter', sans-serif; margin: 0; padding: 14px; color: #0f172a; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .back-btn { background: #0f172a; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 0.74rem; font-weight: 700; }
    .page-title { font-size: 0.95rem; font-weight: 800; margin: 0; }
    .story-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
    .story-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: #64748b; font-weight: 700; margin-bottom: 6px; }
    .story-title { font-size: 0.92rem; font-weight: 800; color: #1e293b; margin: 0 0 6px 0; }
    .story-body { font-size: 0.78rem; line-height: 1.6; color: #334155; white-space: pre-line; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .action-btn { background: #10b981; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <header class="header-bar">
    <a href="index.html" class="back-btn">⬅️ Dashboard</a>
    <h1 class="page-title">Sabak Amooz Waqiat</h1>
  </header>

  <main id="waqiatList" role="feed"></main>

  <script>
    const list = document.getElementById('waqiatList');
    if (typeof waqiatDatabase !== 'undefined') {
      waqiatDatabase.forEach(item => {
        const art = document.createElement('article');
        art.className = 'story-card';
        art.setAttribute('itemscope', '');
        art.setAttribute('itemtype', 'https://schema.org/Article');
        art.innerHTML = `
          <div class="story-meta">
            <span style="color:#059669;">📁 ${item.category}</span>
            <time datetime="${item.date}">📅 ${item.date}</time>
          </div>
          <h2 class="story-title" itemprop="headline">${item.title}</h2>
          <div class="story-body" itemprop="articleBody">${item.fullStory}</div>
          <div class="btn-row">
            <button class="action-btn" onclick="shareWaqiya('${escape(item.title)}', '${escape(item.fullStory)}')">📤 WhatsApp Share</button>
          </div>
        `;
        list.appendChild(art);
      });
    }

    function shareWaqiya(t, b) {
      const title = unescape(t);
      const text = `📖 *${title}*\n\n${unescape(b)}\n\nRozana deeni waqiat ke liye:\n${window.location.href}`;
      if (navigator.share) {
        navigator.share({ title: title, text: text, url: window.location.href });
      } else {
        navigator.clipboard.writeText(text);
        alert("Waqiya copy ho gaya!");
      }
    }
  </script>
</body>
</html>
